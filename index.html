<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#093025">
<meta name="format-detection" content="telephone=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="قضاء الصلاة">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>قضاء الصلاة اليومية</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=Cairo:wght@500;700;800&display=swap" rel="stylesheet">

<style>
  :root {
    --green-900: #093025;
    --green-700: #0f4c3a;
    --gold: #d4af37;
    --gold-2: #c5a059;
    --gold-dark: #9c7a26;
    --paper: #f7f2e4;
    --paper-2: #ece2c6;
    --ink: #0b2b21;
    --maroon: #7a1f1f;
    --pat-light: none;
    --pat-dark: none;
    --font-ui: "Cairo", "Geeza Pro", -apple-system, "Segoe UI", Tahoma, system-ui, sans-serif;
    --font-title: "Amiri", "Geeza Pro", "Damascus", "Scheherazade New", "Traditional Arabic", serif;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  /* No double-tap zoom when tapping + / - quickly (iOS Safari) */
  button, input, .btn-round, .btn-action { touch-action: manipulation; }
  button { -webkit-appearance: none; appearance: none; font-family: inherit; }

  html, body {
    margin: 0;
    min-height: 100%;
    width: 100%;
    max-width: 100%;
  }
  body { overflow-x: hidden; }

  body {
    font-family: var(--font-ui);
    color: var(--ink);
    background-color: var(--paper);
    background-image: var(--pat-light);
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }

  .app {
    width: 100%;
    max-width: 460px;
    margin: 0 auto;
    padding: 18px 12px 60px;
    box-sizing: border-box;
  }

  /* ---------- Header ---------- */
  .title {
    position: relative;
    isolation: isolate;
    width: min(calc(100% - 44px), 300px);   /* leaves room for the side points */
    margin: 8px auto 28px;
    padding: 6px 12px 2px;
    text-align: center;
    background: linear-gradient(#fbf7ea, var(--paper));
    border: 3px solid var(--gold-2);
    border-radius: 40px;
    box-shadow:
      inset 0 0 0 4px var(--paper),
      inset 0 0 0 5px var(--gold-2),
      0 8px 16px rgba(9, 48, 37, .18);
  }
  .title::before,
  .title::after {
    content: "";
    position: absolute;
    top: 50%;
    width: 30px;
    height: 30px;
    z-index: -1;
    background: var(--paper);
    border: 3px solid var(--gold-2);
  }
  .title::before { right: -12px; transform: translateY(-50%) rotate(45deg); }
  .title::after  { left: -12px;  transform: translateY(-50%) rotate(45deg); }
  .title h1 {
    margin: 0;
    font-family: var(--font-title);
    font-weight: 700;
    font-size: clamp(1.45rem, 6.6vw, 1.9rem);
    line-height: 1.75;
    white-space: nowrap;
    color: var(--maroon);
    text-shadow: 0 1px 0 rgba(212, 175, 55, .55);
  }

  /* ---------- Rows ---------- */
  .row {
    display: grid;
    grid-template-columns: 34% 1fr;
    gap: 6px;
    align-items: center;
    width: 100%;
    margin-bottom: 15px;
  }
  .row.wide { grid-template-columns: max-content 1fr; }
  .row > * { min-width: 0; }

  .plate {
    display: flex;
    align-items: center;
    min-height: 46px;
    padding: 4px 10px;
    white-space: nowrap;
    background: var(--paper);
    border: 1.5px solid var(--green-700);
    border-radius: 14px;
    font-weight: 700;
    font-size: clamp(.86rem, 3.9vw, 1.05rem);
    line-height: 1.3;
    color: var(--green-900);
    box-shadow: 0 2px 0 rgba(9, 48, 37, .12);
  }
  .plate.dark {
    background-image: var(--pat-dark), linear-gradient(90deg, var(--green-900), var(--green-700));
    color: var(--paper);
    border-color: var(--green-900);
    padding-left: 12px;
    padding-right: 12px;
    font-size: clamp(.8rem, 3.6vw, 1rem);
  }

  .ctrl {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
    height: 46px;
    padding: 0 5px;
    background-image: var(--pat-dark), linear-gradient(90deg, var(--green-900), var(--green-700));
    border: 1.5px solid var(--green-900);
    border-radius: 16px;
  }
  .ctrl.center { justify-content: center; }
  .ctrl.center .btn-round + .btn-round { margin-right: 14px; }   /* margin, not gap: works on iOS < 14.5 too */

  .btn-round {
    flex: none;
    width: 52px;
    height: 52px;
    padding: 0;
    display: grid;
    place-items: center;
    color: var(--green-700);
    border: 0;
    border-radius: 50%;
    cursor: pointer;
    background: radial-gradient(circle at 50% 30%, #fffaf0, var(--paper-2));
    box-shadow:
      0 0 0 3px var(--gold-2),
      inset 0 0 0 2px rgba(255, 255, 255, .7),
      0 4px 8px rgba(0, 0, 0, .28);
    transition: transform .08s ease, box-shadow .08s ease;
  }
  .btn-round svg { width: 24px; height: 24px; }
  .btn-round:active { transform: scale(.92); box-shadow: 0 0 0 3px var(--gold), 0 1px 3px rgba(0,0,0,.3); }

  .counter {
    flex: none;
    width: 58px;
    height: 34px;
    padding: 0 2px;
    text-align: center;
    font-family: var(--font-ui);
    font-weight: 800;
    font-size: 1.2rem;
    color: var(--green-900);
    background: var(--paper);
    border: 0;
    border-radius: 8px;
    box-shadow: inset 0 2px 4px rgba(9, 48, 37, .18);
    -webkit-appearance: none;
    appearance: none;
    -webkit-text-fill-color: var(--green-900);   /* iOS dims text of some inputs */
    opacity: 1;
  }

  .result {
    min-height: 46px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 4px 8px;
    text-align: center;
    font-weight: 700;
    font-size: clamp(.86rem, 3.9vw, 1.05rem);
    line-height: 1.45;
    color: var(--green-900);
    background: var(--paper);
    border: 1.5px solid var(--green-700);
    border-radius: 14px;
  }

  /* ---------- Footer actions ---------- */
  .actions {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    width: 100%;
    margin-top: 24px;
  }
  .btn-action {
    display: flex;
    align-items: center;
    justify-content: center;
    min-width: 0;
    min-height: 56px;
    padding: 6px 8px;
    white-space: nowrap;
    font-family: var(--font-ui);
    font-weight: 700;
    font-size: clamp(.88rem, 3.8vw, 1.05rem);
    color: var(--paper);
    cursor: pointer;
    background-image: var(--pat-dark), linear-gradient(90deg, var(--green-900), var(--green-700));
    border: 2px solid var(--gold-2);
    border-radius: 18px;
    box-shadow: inset 0 0 0 3px var(--green-900), inset 0 0 0 4px rgba(212, 175, 55, .5), 0 5px 10px rgba(9, 48, 37, .28);
    transition: transform .08s ease;
  }
  .btn-action:active { transform: scale(.97); }
  .btn-action svg { flex: none; width: 22px; height: 22px; margin-left: 8px; color: var(--gold); }

  /* separate rules: an unsupported selector must not drop the other one (older Safari) */
  button:focus-visible {
    outline: 3px solid var(--gold-dark);
    outline-offset: 3px;
  }
  .counter:focus-visible {
    outline: 3px solid var(--gold-dark);
    outline-offset: 3px;
  }
  .sr-file {
    position: absolute;
    width: 1px;
    height: 1px;
    opacity: 0;
    overflow: hidden;
    pointer-events: none;
  }

  /* ---------- Bottom band + toast ---------- */
  .band {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    height: calc(14px + env(safe-area-inset-bottom, 0px));
    background-image: var(--pat-dark), linear-gradient(90deg, var(--green-900), var(--green-700));
    border-top: 2px solid var(--gold-2);
    pointer-events: none;
  }

  .toast {
    position: fixed;
    left: 50%;
    bottom: calc(36px + env(safe-area-inset-bottom, 0px));
    z-index: 10;
    max-width: calc(100vw - 32px);
    width: max-content;
    padding: 12px 20px;
    text-align: center;
    font-weight: 700;
    line-height: 1.5;
    color: var(--paper);
    background: var(--green-900);
    border: 2px solid var(--gold-2);
    border-radius: 16px;
    box-shadow: 0 8px 20px rgba(0, 0, 0, .35);
    opacity: 0;
    transform: translate(-50%, 12px);
    pointer-events: none;
    transition: opacity .2s ease, transform .2s ease;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  .toast.error { background: #5a1414; border-color: #d98a8a; }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>

<body>
<main class="app">
  <header class="title"><h1>قضاء الصلاة اليومية</h1></header>

  <section id="prayers" aria-label="عدّاد الصلوات الفائتة"></section>

  <div class="row wide">
    <div class="plate dark">قضاء صلاة يوم كامل</div>
    <div class="ctrl center">
      <button type="button" class="btn-round" id="dayPlus"  aria-label="قضاء صلاة يوم كامل: زيادة"></button>
      <button type="button" class="btn-round" id="dayMinus" aria-label="قضاء صلاة يوم كامل: إنقاص"></button>
    </div>
  </div>

  <div class="row wide">
    <div class="plate dark">عدد أيام الصلاة المطلوبة</div>
    <div class="result" id="result" role="status" aria-live="polite">لا يوجد صلوات مطلوبة</div>
  </div>

  <div class="actions">
    <button type="button" class="btn-action" id="importBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12m0 0-4.5-4.5M12 15l4.5-4.5M4 15v4a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-4"/></svg>
      <span>استيراد البيانات</span>
    </button>
    <button type="button" class="btn-action" id="exportBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V3m0 0L7.5 7.5M12 3l4.5 4.5M4 15v4a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-4"/></svg>
      <span>تصدير البيانات</span>
    </button>
  </div>

  <input type="file" id="filePicker" class="sr-file" accept=".json,application/json" tabindex="-1" aria-hidden="true">
</main>

<div class="band" aria-hidden="true"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<!-- ============ 1) Arabic number-to-words (pure functions) ============ -->
<script>
const UNITS_M = ['', 'واحد', 'اثنان', 'ثلاثة', 'أربعة', 'خمسة', 'ستة', 'سبعة', 'ثمانية', 'تسعة', 'عشرة'];
const UNITS_F = ['', 'واحدة', 'اثنتان', 'ثلاث', 'أربع', 'خمس', 'ست', 'سبع', 'ثماني', 'تسع', 'عشر'];
const TENS = { 2: 'عشرون', 3: 'ثلاثون', 4: 'أربعون', 5: 'خمسون', 6: 'ستون', 7: 'سبعون', 8: 'ثمانون', 9: 'تسعون' };
const HUNDREDS = ['', 'مئة', 'مئتان', 'ثلاثمئة', 'أربعمئة', 'خمسمئة', 'ستمئة', 'سبعمئة', 'ثمانمئة', 'تسعمئة'];

const DAY    = { f: false, sing: 'يوم',  acc: 'يوماً',  dual: 'يومان',  dualObl: 'يومين',  plur: 'أيام'  };
const PRAYER = { f: true,  sing: 'صلاة', acc: 'صلاةً', dual: 'صلاتان', dualObl: 'صلاتين', plur: 'صلوات' };

function teenWord(n, f) {                       // 11..19
  if (n === 11) return f ? 'إحدى عشرة' : 'أحد عشر';
  if (n === 12) return f ? 'اثنتا عشرة' : 'اثنا عشر';
  return (f ? UNITS_F : UNITS_M)[n - 10] + ' ' + (f ? 'عشرة' : 'عشر');
}
function tensWord(n, f) {                       // 20..99
  const t = Math.floor(n / 10), u = n % 10;
  if (!u) return TENS[t];
  const unit = u === 1 ? (f ? 'إحدى' : 'واحد')
             : u === 2 ? (f ? 'اثنتان' : 'اثنان')
             : (f ? UNITS_F : UNITS_M)[u];
  return unit + ' و' + TENS[t];
}
function thousandsWord(t) {
  if (t === 1) return 'ألف';
  if (t === 2) return 'ألفان';
  return UNITS_M[t] + ' آلاف';
}

/* "ثلاث صلوات", "خمسة أيام", "أحد عشر يوماً", "مئة وخمسة أيام" ... */
function countPhrase(n, noun, oblique = false) {
  if (n <= 0) return '';
  if (n >= 10000) return n + ' ' + noun.sing;
  const t = Math.floor(n / 1000), h = Math.floor((n % 1000) / 100), r = n % 100;
  const head = [];
  if (t) head.push(thousandsWord(t));
  if (h) head.push(HUNDREDS[h]);

  let tail = null;
  if (r === 1)       tail = noun.sing + ' ' + (noun.f ? 'واحدة' : 'واحد');
  else if (r === 2)  tail = oblique ? noun.dualObl : noun.dual;
  else if (r >= 3 && r <= 10) tail = (noun.f ? UNITS_F : UNITS_M)[r] + ' ' + noun.plur;
  else if (r >= 11 && r <= 19) tail = teenWord(r, noun.f) + ' ' + noun.acc;
  else if (r >= 20)  tail = tensWord(r, noun.f) + ' ' + noun.acc;

  if (!head.length) return tail;
  if (tail === null) {
    // dual numerals drop their final ن before the counted noun: مئتا يوم، ألفا يوم
    const last = head.length - 1;
    head[last] = head[last].replace(/(مئتان|ألفان)$/, m => m.slice(0, -1) === 'مئتا' ? 'مئتا' : 'ألفا');
    return head.join(' و') + ' ' + noun.sing;
  }
  return head.join(' و') + ' و' + tail;
}

function describeTotal(total) {
  if (total <= 0) return 'لا يوجد صلوات مطلوبة';
  const days = Math.floor(total / 5), rem = total % 5;
  if (days && rem) return countPhrase(days, DAY) + ' و' + countPhrase(rem, PRAYER, true);
  if (days) return countPhrase(days, DAY);
  return countPhrase(rem, PRAYER);
}
</script>

<!-- ============ 2) App logic ============ -->
<script>
/* ---------- Configuration ---------- */
const CONFIG = {
  FILE_NAME: 'قضاء_الصلاة.json',
  MAX_PER_PRAYER: 9999,
  STORAGE_KEY: 'qada-salah-v1'
};

const PRAYERS = [
  { key: 'fajr',    label: 'صلاة الفجر'  },
  { key: 'dhuhr',   label: 'صلاة الظهر'  },
  { key: 'asr',     label: 'صلاة العصر'  },
  { key: 'maghrib', label: 'صلاة المغرب' },
  { key: 'isha',    label: 'صلاة العشاء' }
];

const ICON_PLUS  = '<svg width="28" height="28" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg>';
const ICON_MINUS = '<svg width="28" height="28" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg>';

/* ---------- Background patterns (eight-point star tiles) ---------- */
(function applyPatterns() {
  const tile = (stroke, opacity) =>
    `<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
       <g fill="none" stroke="${stroke}" stroke-opacity="${opacity}" stroke-width="1">
         <rect x="16" y="16" width="32" height="32"/>
         <rect x="16" y="16" width="32" height="32" transform="rotate(45 32 32)"/>
         <circle cx="32" cy="32" r="7"/>
         <path d="M0 0l16 16M64 0L48 16M0 64l16-16M64 64L48 48"/>
       </g></svg>`;
  const url = svg => `url("data:image/svg+xml,${encodeURIComponent(svg)}")`;
  const root = document.documentElement.style;
  root.setProperty('--pat-light', url(tile('#c5a059', .28)));
  root.setProperty('--pat-dark',  url(tile('#d4af37', .22)));
})();

/* ---------- State ---------- */
const state = { fajr: 0, dhuhr: 0, asr: 0, maghrib: 0, isha: 0 };
const inputs = {};
const clamp = v => Math.min(CONFIG.MAX_PER_PRAYER, Math.max(0, Math.trunc(Number(v)) || 0));

function loadLocal() {
  try {
    const saved = JSON.parse(localStorage.getItem(CONFIG.STORAGE_KEY) || 'null');
    if (saved) PRAYERS.forEach(p => { state[p.key] = clamp(saved[p.key]); });
  } catch (_) { /* storage unavailable: start from zero */ }
}
function saveLocal() {
  try { localStorage.setItem(CONFIG.STORAGE_KEY, JSON.stringify(state)); } catch (_) {}
}

/* ---------- Rendering ---------- */
const $ = id => document.getElementById(id);

function buildRows() {
  const host = $('prayers');
  PRAYERS.forEach(p => {
    const row = document.createElement('div');
    row.className = 'row';
    row.innerHTML = `
      <div class="plate">${p.label}</div>
      <div class="ctrl">
        <button type="button" class="btn-round" data-act="inc" aria-label="زيادة ${p.label}">${ICON_PLUS}</button>
        <input class="counter" type="text" inputmode="numeric" autocomplete="off"
               aria-label="عدد ${p.label} الفائتة" value="0">
        <button type="button" class="btn-round" data-act="dec" aria-label="إنقاص ${p.label}">${ICON_MINUS}</button>
      </div>`;
    const input = row.querySelector('input');
    inputs[p.key] = input;

    row.querySelector('[data-act="inc"]').addEventListener('click', () => change(p.key, +1));
    row.querySelector('[data-act="dec"]').addEventListener('click', () => change(p.key, -1));

    input.addEventListener('input', () => {
      const digits = input.value
        .replace(/[٠-٩]/g, d => d.charCodeAt(0) - 0x0660)
        .replace(/[۰-۹]/g, d => d.charCodeAt(0) - 0x06F0)
        .replace(/\D/g, '');
      input.value = digits;
      state[p.key] = clamp(digits);
      updateResult();
      saveLocal();
    });
    input.addEventListener('blur', () => { input.value = state[p.key]; });
    input.addEventListener('focus', () => setTimeout(() => { try { input.setSelectionRange(0, input.value.length); } catch (_) {} }, 0));

    host.appendChild(row);
  });
  $('dayPlus').innerHTML  = ICON_PLUS;
  $('dayMinus').innerHTML = ICON_MINUS;
}

function updateResult() {
  const total = PRAYERS.reduce((sum, p) => sum + state[p.key], 0);
  $('result').textContent = describeTotal(total);
}

function render() {
  PRAYERS.forEach(p => { inputs[p.key].value = state[p.key]; });
  updateResult();
}

/* ---------- Counter logic ---------- */
function change(key, delta) {
  state[key] = clamp(state[key] + delta);
  render();
  saveLocal();
}
function changeAll(delta) {
  PRAYERS.forEach(p => { state[p.key] = clamp(state[p.key] + delta); });
  render();
  saveLocal();
}

/* ---------- Toast ---------- */
let toastTimer;
function toast(message, type = 'ok', sticky = false) {
  const el = $('toast');
  el.textContent = message;
  el.classList.toggle('error', type === 'error');
  el.classList.add('show');
  clearTimeout(toastTimer);
  if (!sticky) toastTimer = setTimeout(() => el.classList.remove('show'), 3800);
}
function hideToast() { $('toast').classList.remove('show'); }

/* ---------- Backup file: build, validate, apply ---------- */
function buildPayload() {
  return {
    fajr: state.fajr,
    dhuhr: state.dhuhr,
    asr: state.asr,
    maghrib: state.maghrib,
    isha: state.isha,
    lastUpdated: new Date().toISOString()
  };
}

function parseBackup(text) {
  let data;
  try { data = JSON.parse(text); } catch (_) { throw new Error('BAD_FILE'); }
  const valid = data && typeof data === 'object' &&
    PRAYERS.every(p => Number.isFinite(Number(data[p.key])) && Number(data[p.key]) >= 0);
  if (!valid) throw new Error('BAD_FILE');
  return data;
}

function applyBackup(data) {
  PRAYERS.forEach(p => { state[p.key] = clamp(data[p.key]); });
  render();
  saveLocal();
}

/* ---------- Export: the user chooses where to save ---------- */
async function exportToFile() {
  const json = JSON.stringify(buildPayload(), null, 2);
  const blob = new Blob([json], { type: 'application/json' });

  // 1) "Save As" dialog (Chrome / Edge / Opera on desktop). Must be the first await in the click.
  if (typeof window.showSaveFilePicker === 'function') {
    try {
      const handle = await window.showSaveFilePicker({
        suggestedName: CONFIG.FILE_NAME,
        types: [{ description: 'ملف بيانات JSON', accept: { 'application/json': ['.json'] } }]
      });
      const writable = await handle.createWritable();
      await writable.write(blob);
      await writable.close();
      toast('تم حفظ الملف بنجاح ✓');
      return;
    } catch (err) {
      if (err && err.name === 'AbortError') { toast('تم إلغاء الحفظ'); return; }
      console.warn('showSaveFilePicker failed, using fallback', err);
    }
  }

  // 2) System share sheet (phones/tablets): choose Files, SD card, Google Drive, etc.
  const file = new File([blob], CONFIG.FILE_NAME, { type: 'application/json' });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try {
      await navigator.share({ files: [file], title: CONFIG.FILE_NAME });
      toast('تم تصدير الملف ✓');
      return;
    } catch (err) {
      if (err && err.name === 'AbortError') { toast('تم إلغاء الحفظ'); return; }
      console.warn('share failed, using download fallback', err);
    }
  }

  // 3) Plain browser download (the browser decides the location, or asks if set to "ask where to save")
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = CONFIG.FILE_NAME;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 60000);   // Safari needs the URL alive while it starts the download
  const apple = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  toast(apple
    ? 'تم تنزيل الملف. ستجده في تطبيق «الملفات» ← التنزيلات'
    : 'تم تنزيل الملف «' + CONFIG.FILE_NAME + '» على جهازك');
}

/* ---------- Import: the user browses any location ---------- */
function readFileText(file) {
  if (typeof file.text === 'function') return file.text();          // Safari 14+
  return new Promise((resolve, reject) => {                          // older iOS
    const reader = new FileReader();
    reader.onload = () => resolve(String(reader.result));
    reader.onerror = () => reject(reader.error || new Error('READ_FAILED'));
    reader.readAsText(file);
  });
}

async function importFromFile(file) {
  if (!file) return;
  if (file.size > 1024 * 1024) throw new Error('BAD_FILE');
  applyBackup(parseBackup(await readFileText(file)));
  toast('تم استيراد البيانات بنجاح ✓');
}

function errorMessage(err) {
  if (err && err.message === 'BAD_FILE') return 'الملف غير صالح. اختر ملف .json تم تصديره من هذا التطبيق';
  return 'تعذّرت قراءة الملف. أعد المحاولة';
}

/* ---------- Init ---------- */
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
}

loadLocal();
buildRows();
render();

$('dayPlus').addEventListener('click',  () => changeAll(+1));
$('dayMinus').addEventListener('click', () => changeAll(-1));

const filePicker = $('filePicker');

$('exportBtn').addEventListener('click', () => {
  exportToFile().catch(err => { console.error(err); toast('تعذّر حفظ الملف. أعد المحاولة', 'error'); });
});
$('importBtn').addEventListener('click', () => filePicker.click());
filePicker.addEventListener('change', async () => {
  try {
    await importFromFile(filePicker.files[0]);
  } catch (err) {
    console.error(err);
    toast(errorMessage(err), 'error');
  } finally {
    filePicker.value = '';   // lets the same file be picked again
  }
});
</script>
