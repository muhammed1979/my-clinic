      return { ok: true, idForm, refs, ast };
    } catch (e) {
      if (e instanceof FormulaError) {
        const where = (e.pos !== undefined && e.pos !== null) ? ' (عند الموضع ' + (e.pos + 1) + ')' : '';
        return { ok: false, error: e.message + where, pos: e.pos };
      }
      return { ok: false, error: 'صيغة غير صالحة' };
    }
  }

  /* ------------------------- Dependency order ------------------------- */
  function isCalc(c) { return FT.get(c.type).isCalc; }

  /** Returns Set of calc-column ids that participate in a cycle. */
  function findCycles(columns) {
    const calc = columns.filter(isCalc);
    const byId = new Map(calc.map(c => [c.id, c]));
    const state = new Map(); // 1=visiting 2=done
    const cyc = new Set();
    function visit(id, stack) {
      const st = state.get(id);
      if (st === 2) return;
      if (st === 1) { const i = stack.indexOf(id); stack.slice(i).forEach(x => cyc.add(x)); return; }
      state.set(id, 1); stack.push(id);
      const c = byId.get(id);
      refsOf(c.formula || '').forEach(r => { if (byId.has(r)) visit(r, stack); });
      stack.pop(); state.set(id, 2);
    }
    calc.forEach(c => visit(c.id, []));
    return cyc;
  }

  function evaluationOrder(columns) {
    const calc = columns.filter(isCalc);
    const byId = new Map(calc.map(c => [c.id, c]));
    const done = new Set(), order = [];
    function visit(id, seen) {
      if (done.has(id) || seen.has(id)) return;
      seen.add(id);
      refsOf(byId.get(id).formula || '').forEach(r => { if (byId.has(r)) visit(r, seen); });
      done.add(id); order.push(byId.get(id));
    }
    calc.forEach(c => visit(c.id, new Set()));
    return order;
  }

  /* ------------------------- Context & whole-plan computation ------------------------- */
  function rawFormulaValue(rec, col) {
    return FT.get(col.type).toFormula(rec.values ? rec.values[col.id] : undefined, col);
  }

  /**
   * Build an evaluation-context factory. `computed` is a Map(recordId -> {colId: value}).
   * It is shared (and mutated) by computeAll while columns are being evaluated in order.
   */
  function makeContext(columns, records, computed) {
    const lk = columnLookup(columns);
    const colCache = new Map();
    function colArray(id) {
      if (colCache.has(id)) return colCache.get(id);
      const c = lk.byId.get(id);
      if (!c) throw rt('REF');
      const arr = [];
      records.forEach(r => {
        let v;
        if (isCalc(c)) { const row = computed.get(r.id); v = row ? row[id] : null; if (isErr(v)) return; }
        else v = rawFormulaValue(r, c);
        arr.push(v);
      });
      colCache.set(id, arr);
      return arr;
    }
    return {
      invalidate(id) { colCache.delete(id); },
      forRecord(rec) {
        return {
          get(id) {
            const c = lk.byId.get(id);
            if (!c) throw rt('REF');
            if (isCalc(c)) {
              const row = computed.get(rec.id);
              const v = row ? row[id] : undefined;
              if (v === undefined) throw rt('CIRC');
              if (isErr(v)) throw new FormulaError(v.code, v.msg);
              return v;
            }
            return rawFormulaValue(rec, c);
          },
          col: colArray
        };
      }
    };
  }

  /** Evaluate every calculated column for every record. Returns Map(recordId -> {colId: value|errorObj}). */
  function computeAll(columns, records) {
    const computed = new Map();
    records.forEach(r => computed.set(r.id, {}));
    const order = evaluationOrder(columns);
    if (!order.length) return computed;
    const cyc = findCycles(columns);
    const ctx = makeContext(columns, records, computed);
    order.forEach(col => {
      let ast = null, bad = null;
      if (cyc.has(col.id)) bad = errVal(rt('CIRC'));
      else if (!col.formula) bad = errVal(rt('SYNTAX', 'لم يتم تعريف صيغة لهذا الحقل'));
      else { try { ast = parseCached(col.formula); } catch (e) { bad = errVal(e instanceof FormulaError ? e : rt('SYNTAX')); } }
      records.forEach(rec => {
        const row = computed.get(rec.id);
        if (bad) { row[col.id] = bad; return; }
        try {
          let v = evaluate(ast, ctx.forRecord(rec));
          if (typeof v === 'number') v = fin(v);
          row[col.id] = (v === undefined) ? null : v;
        } catch (e) {
          row[col.id] = errVal(e instanceof FormulaError ? e : rt('VALUE'));
        }
      });
      ctx.invalidate(col.id);
    });
    return computed;
  }

  /** Evaluate a single id-form expression against one record (used by validation rules and live preview). */
  function evalForRecord(idText, columns, records, computed, rec) {
    try {
      const ast = parseCached(idText);
      const ctx = makeContext(columns, records, computed).forRecord(rec);
      return { value: evaluate(ast, ctx) };
    } catch (e) {
      return { error: e instanceof FormulaError ? e.message : 'خطأ في التقييم' };
    }
  }

  /** Evaluate a record-less expression made of column-wide aggregates, e.g. IFERROR(COLAVG([#f1])-100%,"") */
  function evalAggregate(idText, columns, records, computed) {
    try {
      const ast = parseCached(idText);
      const ctx = makeContext(columns, records, computed).forRecord({ id: '__agg', values: {} });
      return { value: evaluate(ast, ctx) };
    } catch (e) {
      return { error: e instanceof FormulaError ? e.message : 'خطأ في التقييم' };
    }
  }

  function listFunctions() {
    return Object.keys(FUNCS).map(k => ({ name: k, ar: FUNCS[k].ar, syntax: FUNCS[k].syntax, cat: FUNCS[k].cat }));
  }

  return {
    FormulaError, tokenize, parse, evaluate, validateText, toIdForm, toNameForm, refsOf, usesColAgg,
    computeAll, evalForRecord, evalAggregate, findCycles, listFunctions, isErr, def, FUNCS, isCalc
  };
})();
/* =====================================================================
   SPMERS — CORE 3: plan model, validation, filtering, search, sorting,
   sanitisation of imported data, spreadsheet-cell coercion.
   ===================================================================== */

const SCHEMA_VERSION = 1;
const PACKAGE_FORMAT = 'spmers-plan-package';

const FREQUENCIES = [
  { id: 'daily', label: 'يومي' },
  { id: 'weekly', label: 'أسبوعي' },
  { id: 'monthly', label: 'شهري' },
  { id: 'quarterly', label: 'ربع سنوي' },
  { id: 'semiannual', label: 'نصف سنوي' },
  { id: 'annual', label: 'سنوي' },
  { id: 'custom', label: 'مخصص' }
]; // extend here to add more reporting frequencies

const PLAN_STATUSES = [
  { id: 'draft', label: 'مسودة' },
  { id: 'active', label: 'نشطة' },
  { id: 'completed', label: 'مكتملة' },
  { id: 'suspended', label: 'متوقفة' },
  { id: 'archived', label: 'مؤرشفة' }
];

/* Role model prepared for a future authenticated backend. Today it is a UI-level
   simulation only (see README): a real deployment must enforce these server-side. */
const ROLES = {
  admin: { label: 'مدير النظام', can: ['structure', 'plans', 'write', 'delete', 'import', 'export', 'review', 'reports', 'audit', 'reset'] },
  entry: { label: 'مدخل بيانات', can: ['write', 'export', 'reports'] },
  reviewer: { label: 'مراجع', can: ['review', 'export', 'reports', 'audit'] },
  viewer: { label: 'مشاهد', can: ['reports'] }
};

const OPTION_COLORS = ['#1F7A4D', '#B7791F', '#B83232', '#2B6CB0', '#6B46C1', '#0F7C8A', '#718096', '#C05621'];

const Model = {
  freqLabel(plan) {
    if (plan.frequency === 'custom') return plan.customFrequency || 'مخصص';
    const f = FREQUENCIES.find(x => x.id === plan.frequency);
    return f ? f.label : '';
  },
  statusLabel(id) { const s = PLAN_STATUSES.find(x => x.id === id); return s ? s.label : id; },

  newColumn(type, name) {
    const t = FT.get(type);
    const col = Object.assign({
      id: U.uid('f').replace('f_', 'f'), name: name || '', type: t.id, description: '', required: false,
      defaultValue: null, placeholder: '', editable: !t.isCalc, visible: true, sortable: true,
      filterable: false, searchable: true, order: 0, width: 0
    }, t.defaults());
    return col;
  },

  newPlan(meta) {
    const now = U.nowISO();
    const y = new Date().getFullYear();
    return {
      id: U.uid('plan'), schemaVersion: SCHEMA_VERSION,
      name: (meta && meta.name) || 'خطة استراتيجية جديدة',
      description: (meta && meta.description) || '', authority: (meta && meta.authority) || '',
      startYear: (meta && meta.startYear) || y, endYear: (meta && meta.endYear) || y + 4,
      frequency: (meta && meta.frequency) || 'quarterly', customFrequency: '',
      status: 'draft', createdAt: now, updatedAt: now,
      config: {
        columns: [], rules: [], summaries: [], filterPresets: [], reports: [],
        settings: { pageSize: 25 },
        view: { filters: {}, search: '', hidden: [], sort: null, activeReportId: null }
      },
      records: []
    };
  },

  newRecord(plan, withDefaults) {
    const now = U.nowISO();
    const values = {};
    plan.config.columns.forEach(c => {
      if (FT.get(c.type).isCalc) return;
      values[c.id] = withDefaults !== false && !U.isBlank(c.defaultValue) ? U.clone(c.defaultValue) : null;
    });
    return { id: U.uid('r'), values, createdAt: now, updatedAt: now, review: null };
  },

  sortedColumns(plan) { return plan.config.columns.slice().sort((a, b) => a.order - b.order); },
  reindex(plan) { Model.sortedColumns(plan).forEach((c, i) => { c.order = i; }); },

  /** Value used for filter / sort / aggregation (calculated errors become null). */
  value(rec, col, computed) {
    if (FT.get(col.type).isCalc) {
      const row = computed && computed.get(rec.id);
      const v = row ? row[col.id] : null;
      return FX.isErr(v) ? null : (v === undefined ? null : v);
    }
    const v = rec.values ? rec.values[col.id] : null;
    return v === undefined ? null : v;
  },
  cellText(rec, col, computed) {
    if (FT.get(col.type).isCalc) {
      const row = computed && computed.get(rec.id);
      const v = row ? row[col.id] : null;
      if (FX.isErr(v)) return '#خطأ';
      return FT.get(col.type).format(v, col);
    }
    return FT.get(col.type).format(rec.values ? rec.values[col.id] : null, col);
  },
  /** Plain exportable value (numbers stay numbers, dates stay ISO strings). */
  rawExport(rec, col, computed) {
    const v = Model.value(rec, col, computed);
    return v;
  }
};


/* ---------------------- Cross-field validation rules ----------------------
   A rule is a formula that must evaluate to TRUE (same engine as calculated fields):
   { id, name, enabled, expr (field ids), message, severity: 'error'|'warning',
     appliesTo: fieldId (the field the error is shown on), scope: 'row',
     onBlank: 'evaluate' | 'skip'   evaluate = blanks are evaluated like Excel (default);
                                    skip     = rule not run when ANY field it reads is blank
     onError: 'fail' | 'skip'       fail = an evaluation error is a validation failure (default)
     skipWhenTargetBlank: Excel's "Ignore blank" option for the rule's own field,
     source: {sqref, formulaA1}     where it came from when imported from Excel }
   Statuses: pass | fail | error | skipped | blocked | disabled                                   */
const RuleEngine = {
  depsOf(rule) { return rule.deps || FX.refsOf(rule.expr || ''); },

  /** Evaluate one rule on one record. rec = {id, values, invalid?}. */
  evaluate(rule, rec, columns, computed, allRecords) {
    const out = { ruleId: rule.id, name: rule.name || '', severity: rule.severity === 'warning' ? 'warning' : 'error', colId: rule.appliesTo || null, status: 'pass', ok: true, message: '', detail: '' };
    const done = (status, ok, message, detail) => Object.assign(out, { status, ok, message: message || '', detail: detail || '' });
    if (!rule || !rule.expr || rule.enabled === false) return done('disabled', true);
    const deps = RuleEngine.depsOf(rule);
    if (!out.colId) out.colId = deps[0] || null;
    const byId = new Map(columns.map(c => [c.id, c]));
    const plain = deps.map(id => byId.get(id)).filter(c => c && !FT.get(c.type).isCalc);
    if (rec.invalid && deps.some(id => rec.invalid[id])) return done('blocked', true);
    if (rule.skipWhenTargetBlank && rule.appliesTo && U.isBlank(rec.values[rule.appliesTo])) return done('skipped', true);
    if (rule.onBlank === 'skip' && plain.some(c => U.isBlank(rec.values[c.id]))) return done('skipped', true);
    const r = FX.evalForRecord(rule.expr, columns, allRecords || [rec], computed || new Map(), rec);
    if (r.error) {
      if (rule.onError === 'skip') return done('skipped', true, '', r.error);
      return done('error', false, rule.message || ('تعذّر تقييم القاعدة: ' + (rule.name || '')), 'خطأ في التقييم: ' + r.error);
    }
    let ok;
    if (typeof r.value === 'boolean') ok = r.value;
    else if (typeof r.value === 'number') ok = r.value !== 0;      // Excel "custom" validation: any non-zero number passes
    else return done('error', false, rule.message || 'القاعدة لا تُرجع صح/خطأ', 'نتيجة القاعدة ليست قيمة منطقية');
    return ok ? done('pass', true) : done('fail', false, rule.message || ('مخالفة للقاعدة: ' + (rule.name || '')));
  },

  /** Evaluate all enabled rules. Returns [{colId, message, severity, status, ruleId, detail}] for violations only. */
  violations(plan, rec, computed, allRecords) {
    const out = [];
    (plan.config.rules || []).forEach(rule => {
      const r = RuleEngine.evaluate(rule, rec, plan.config.columns, computed, allRecords);
      if (!r.ok) out.push({ colId: r.colId, message: r.message, severity: r.severity, status: r.status, ruleId: r.ruleId, detail: r.detail, ruleName: r.name });
    });
    return out;
  },
  /** Which rules must be re-run when one field changes (dependency index). */
  affectedBy(rules, fieldId) { return (rules || []).filter(r => r.appliesTo === fieldId || RuleEngine.depsOf(r).includes(fieldId)); }
};

/* ---------------------- Record validation ---------------------- */
const Validate = {
  /** Validate one column value. Returns message or null. */
  value(col, v) {
    const t = FT.get(col.type);
    if (t.isCalc) return null;
    if (col.required && U.isBlank(v)) return 'الحقل «' + col.name + '» مطلوب ولا يمكن تركه فارغاً';
    const m = t.validate(v, col);
    return m ? '«' + col.name + '»: ' + m : null;
  },

  /** Validate a record: returns [{colId, message, severity}] */
  record(plan, rec, computed, allRecords) {
    const issues = [];
    plan.config.columns.forEach(col => {
      const m = Validate.value(col, rec.values[col.id]);
      if (m) issues.push({ colId: col.id, message: m, severity: 'error' });
    });
    // cross-field rules (Excel-style data validation): blanks are evaluated, evaluation errors count as failures
    const invalid = {}; issues.forEach(i => { invalid[i.colId] = true; });
    RuleEngine.violations(plan, { id: rec.id, values: rec.values, invalid }, computed, allRecords).forEach(v => {
      issues.push({ colId: v.colId, message: v.message + (v.status === 'error' && v.detail ? ' — ' + v.detail : ''), severity: v.severity, ruleId: v.ruleId });
    });
    return issues;
  }
};

/* ---------------------- Filtering / search / sorting ---------------------- */
const Filter = {
  OPS: {
    text: [['contains', 'يحتوي على'], ['starts', 'يبدأ بـ'], ['exact', 'يطابق تماماً'], ['notcontains', 'لا يحتوي على'], ['empty', 'فارغ'], ['notempty', 'غير فارغ']],
    number: [['eq', 'يساوي'], ['ne', 'لا يساوي'], ['gt', 'أكبر من'], ['gte', 'أكبر من أو يساوي'], ['lt', 'أصغر من'], ['lte', 'أصغر من أو يساوي'], ['between', 'بين'], ['empty', 'فارغ'], ['notempty', 'غير فارغ']],
    date: [['on', 'في تاريخ محدد'], ['before', 'قبل'], ['after', 'بعد'], ['between', 'بين'], ['empty', 'فارغ'], ['notempty', 'غير فارغ']],
    select: [['in', 'أحد الخيارات']],
    multiselect: [['in', 'أحد الخيارات']],
    boolean: [['is', 'القيمة']]
  },
  BLANK: '__blank__',

  defaultOp(kind) { return { text: 'contains', number: 'eq', date: 'between', select: 'in', multiselect: 'in', boolean: 'is' }[kind] || 'contains'; },

  isActive(f, kind) {
    if (!f) return false;
    if (f.op === 'empty' || f.op === 'notempty') return true;
    switch (kind) {
      case 'select': case 'multiselect': return Array.isArray(f.v) && f.v.length > 0;
      case 'boolean': return f.v === 'true' || f.v === 'false';
      case 'number': case 'date':
        if (f.op === 'between') return !U.isBlank(f.v) || !U.isBlank(f.v2);
        return !U.isBlank(f.v);
      default: return !U.isBlank(f.v);
    }
  },

  /** Build predicate fn(value)->bool for one column filter. */
  predicate(kind, f) {
    const op = f.op || Filter.defaultOp(kind);
    if (op === 'empty') return v => U.isBlank(v);
    if (op === 'notempty') return v => !U.isBlank(v);
    switch (kind) {
      case 'number': {
        const a = U.parseNumber(f.v), b = U.parseNumber(f.v2);
        const num = v => (typeof v === 'number') ? v : U.parseNumber(v);
        return v => {
          if (U.isBlank(v)) return false;
          const n = num(v); if (isNaN(n)) return false;
          switch (op) {
            case 'eq': return !isNaN(a) && n === a;
            case 'ne': return !isNaN(a) && n !== a;
            case 'gt': return !isNaN(a) && n > a;
            case 'gte': return !isNaN(a) && n >= a;
            case 'lt': return !isNaN(a) && n < a;
            case 'lte': return !isNaN(a) && n <= a;
            case 'between': return (isNaN(a) || n >= a) && (isNaN(b) || n <= b);
          }
          return true;
        };
      }
      case 'date': {
        const a = f.v || '', b = f.v2 || '';
        return v => {
          if (U.isBlank(v)) return false;
          const d = String(v).slice(0, 10);
          switch (op) {
            case 'on': return d === a;
            case 'before': return d < a;
            case 'after': return d > a;
            case 'between': return (!a || d >= a) && (!b || d <= b);
          }
          return true;
        };
      }
      case 'select': {
        const set = new Set(f.v || []);
        return v => U.isBlank(v) ? set.has(Filter.BLANK) : set.has(v);
      }
      case 'multiselect': {
        const set = new Set(f.v || []);
        return v => (!Array.isArray(v) || !v.length) ? set.has(Filter.BLANK) : v.some(x => set.has(x));
      }
      case 'boolean': {
        const want = f.v === 'true';
        return v => v === want;
      }
      default: {
        const q = U.normalizeText(f.v);
        return v => {
          const s = U.normalizeText(Array.isArray(v) ? v.join(' ') : (v === null || v === undefined ? '' : v));
          switch (op) {
            case 'starts': return s.startsWith(q);
            case 'exact': return s === q;
            case 'notcontains': return !s.includes(q);
            default: return s.includes(q);
          }
        };
      }
    }
  },

  apply(records, columns, computed, filters) {
    const active = [];
    Object.keys(filters || {}).forEach(id => {
      const col = columns.find(c => c.id === id);
      if (!col) return;
      const kind = FT.filterKindOf(col);
      if (Filter.isActive(filters[id], kind)) active.push({ col, pred: Filter.predicate(kind, filters[id]) });
    });
    if (!active.length) return records;
    return records.filter(r => active.every(a => a.pred(Model.value(r, a.col, computed))));
  },

  searchTerms(q) { return U.normalizeText(q).split(' ').filter(Boolean); },

  recordBlob(rec, columns, computed) {
    let out = '';
    columns.forEach(col => {
      if (!col.searchable) return;
      const v = Model.value(rec, col, computed);
      if (U.isBlank(v)) return;
      const t = FT.get(col.type);
      out += ' ' + t.searchText(v, col);
      if (typeof v === 'number') out += ' ' + String(v);
    });
    return out;
  },

  search(records, columns, computed, q) {
    const terms = Filter.searchTerms(q);
    if (!terms.length) return records;
    return records.filter(r => {
      const blob = Filter.recordBlob(r, columns, computed);
      return terms.every(t => blob.includes(t));
    });
  },

  describe(col, f) {
    const kind = FT.filterKindOf(col);
    const op = f.op || Filter.defaultOp(kind);
    const opLabel = ((Filter.OPS[kind] || []).find(o => o[0] === op) || [0, ''])[1];
    const fmt = v => FT.get(col.type).isDate ? D.fmtDate(v) : v;
    if (op === 'empty' || op === 'notempty') return col.name + ': ' + opLabel;
    if (kind === 'select' || kind === 'multiselect') return col.name + ': ' + (f.v || []).map(x => x === Filter.BLANK ? '(فارغ)' : x).join('، ');
    if (kind === 'boolean') return col.name + ': ' + (f.v === 'true' ? 'نعم' : 'لا');
    if (op === 'between') return col.name + ' ' + opLabel + ' ' + (U.isBlank(f.v) ? '…' : fmt(f.v)) + ' و ' + (U.isBlank(f.v2) ? '…' : fmt(f.v2));
    return col.name + ' ' + opLabel + ' ' + fmt(f.v);
  }
};

const Sorter = {
  sort(records, columns, computed, sort) {
    if (!sort || !sort.colId) return records;
    const col = columns.find(c => c.id === sort.colId);
    if (!col) return records;
    const t = FT.get(col.type);
    const dir = sort.dir === 'desc' ? -1 : 1;
    const withKey = records.map((r, i) => ({ r, i, v: Model.value(r, col, computed) }));
    withKey.sort((x, y) => {
      const bx = U.isBlank(x.v), by = U.isBlank(y.v);
      if (bx && by) return x.i - y.i;
      if (bx) return 1;           // blanks always last
      if (by) return -1;
      const c = t.compare(x.v, y.v);
      return c !== 0 ? c * dir : x.i - y.i;
    });
    return withKey.map(x => x.r);
  }
};

/* ---------------------- Sanitising untrusted data ---------------------- */

  /** Deep-copy plain JSON while dropping dangerous keys, functions and deep nesting. */
  deep(o, depth) {

    if (typeof o === 'string') return U.textLimit(o, 20000);

  column(raw, idMap) {

    const c = Model.newColumn(type, Sanitize.str(raw.name, 120) || 'حقل');
    let id = Sanitize.str(raw.id, 40);

    ['required', 'editable', 'visible', 'sortable', 'filterable', 'searchable'].forEach(k => { if (typeof raw[k] === 'boolean') c[k] = raw[k]; });
    ['minLength', 'maxLength', 'min', 'max', 'decimals'].forEach(k => { if (raw[k] !== undefined && raw[k] !== null) c[k] = (raw[k] === '' ? '' : (isNaN(Number(raw[k])) ? (FT.isDateCol(c) && (k === 'min' || k === 'max') ? Sanitize.str(raw[k], 20) : '') : Number(raw[k]))); });
    c.order = Number.isFinite(raw.order) ? raw.order : 0;

        const label = Sanitize.str(typeof o === 'string' ? o : (o && o.label), 200).trim();
        if (!label || seen.has(label)) return null;
        seen.add(label);
        const color = (o && typeof o.color === 'string' && /^#[0-9a-fA-F]{6}$/.test(o.color)) ? o.color : OPTION_COLORS[i % OPTION_COLORS.length];

  /** Sanitise a parsed plan package. Returns {plan, warnings}. Always yields a NEW plan id unless keepId. */
  package(raw, keepId) {

    const rp = U.isPlainObject(raw.plan) ? raw.plan : raw;
    const cfg = U.isPlainObject(rp.config) ? rp.config : {};
    if (!Array.isArray(cfg.columns)) throw new Error('الملف لا يحتوي على تعريف الحقول (columns)');
    if (cfg.columns.length > 200) throw new Error('عدد الحقول يتجاوز الحد المسموح (200)');

    const plan = Model.newPlan({});
    if (keepId && typeof rp.id === 'string' && /^[\w-]{3,60}$/.test(rp.id)) plan.id = rp.id;
    plan.name = Sanitize.str(rp.name, 200) || 'خطة مستوردة';
    plan.description = Sanitize.str(rp.description, 3000);
    plan.authority = Sanitize.str(rp.authority, 300);
    plan.startYear = Sanitize.yearNum(rp.startYear, plan.startYear);
    plan.endYear = Sanitize.yearNum(rp.endYear, plan.endYear);
    plan.frequency = FREQUENCIES.some(f => f.id === rp.frequency) ? rp.frequency : 'custom';
    plan.customFrequency = Sanitize.str(rp.customFrequency, 100);
    plan.status = PLAN_STATUSES.some(s => s.id === rp.status) ? rp.status : 'draft';
    if (typeof rp.createdAt === 'string' && !isNaN(Date.parse(rp.createdAt))) plan.createdAt = rp.createdAt;

    // columns (ids are kept when valid so formulas / reports keep working)
    const idMap = new Map();
    const usedNames = new Set();
    plan.config.columns = cfg.columns.filter(U.isPlainObject).map(rc => Sanitize.column(rc, idMap));
    plan.config.columns.forEach(c => {
      let n = c.name, k = 2;
      while (usedNames.has(U.normalizeText(n))) { n = c.name + ' ' + (k++); }
      c.name = n; usedNames.add(U.normalizeText(n));
    });

    const remap = s => String(s || '').replace(/\[#([^\]]+)\]/g, (m, id) => '[#' + (idMap.get(id) || id) + ']');
    cfg.columns.filter(U.isPlainObject).forEach((rc, i) => {
      const c = plan.config.columns[i];
      if (FT.get(c.type).isCalc) c.formula = remap(c.formula);
    });
    Model.reindex(plan);

    plan.config.rules = (Array.isArray(cfg.rules) ? cfg.rules : []).slice(0, 400).filter(U.isPlainObject).map(r => {
      const o = {
        id: Sanitize.str(r.id, 40) || U.uid('rule'), name: Sanitize.str(r.name, 200), expr: remap(Sanitize.str(r.expr, 4000)),
        message: Sanitize.str(r.message, 600), severity: r.severity === 'warning' ? 'warning' : 'error', enabled: r.enabled !== false,
        onBlank: r.onBlank === 'skip' ? 'skip' : 'evaluate', onError: r.onError === 'skip' ? 'skip' : 'fail', scope: 'row', skipWhenTargetBlank: !!r.skipWhenTargetBlank
      };
      if (typeof r.appliesTo === 'string' && r.appliesTo) o.appliesTo = idMap.get(r.appliesTo) || r.appliesTo;
      if (U.isPlainObject(r.source)) o.source = Sanitize.deep(r.source);
      return o;
    });
    plan.config.summaries = (Array.isArray(cfg.summaries) ? cfg.summaries : []).slice(0, 100).filter(U.isPlainObject).map(s => ({
      id: Sanitize.str(s.id, 40) || U.uid('sum'), label: Sanitize.str(s.label, 200), expr: remap(Sanitize.str(s.expr, 4000)), fmt: ['percentfrac', 'number'].includes(s.fmt) ? s.fmt : 'number',
      decimals: Number.isFinite(s.decimals) ? U.clamp(s.decimals, 0, 6) : 1, color: /^#[0-9a-fA-F]{6}$/.test(s.color || '') ? s.color : '#0E5A63'
    }));
    if (U.isPlainObject(cfg.excelSource)) plan.config.excelSource = Sanitize.deep(cfg.excelSource);
    plan.config.filterPresets = (Array.isArray(cfg.filterPresets) ? cfg.filterPresets : []).slice(0, 100).filter(U.isPlainObject).map(p => ({
      id: Sanitize.str(p.id, 40) || U.uid('flt'), name: Sanitize.str(p.name, 200), filters: Sanitize.deep(p.filters || {}), search: Sanitize.str(p.search, 300)
    }));
    plan.config.reports = (Array.isArray(cfg.reports) ? cfg.reports : []).slice(0, 100).filter(U.isPlainObject).map(r => Sanitize.deep(r));
    if (U.isPlainObject(cfg.settings)) plan.config.settings = Object.assign({ pageSize: 25 }, Sanitize.deep(cfg.settings));
    if (U.isPlainObject(cfg.view)) {
      const v = Sanitize.deep(cfg.view);
      plan.config.view = { filters: U.isPlainObject(v.filters) ? v.filters : {}, search: Sanitize.str(v.search, 300), hidden: Array.isArray(v.hidden) ? v.hidden.map(x => String(x)) : [], sort: U.isPlainObject(v.sort) ? v.sort : null, activeReportId: typeof v.activeReportId === 'string' ? v.activeReportId : null };
    }

    // records
    const rawRecs = Array.isArray(raw.records) ? raw.records : (Array.isArray(rp.records) ? rp.records : (raw.data && Array.isArray(raw.data.records) ? raw.data.records : []));
    if (rawRecs.length > 200000) throw new Error('عدد السجلات يتجاوز الحد المسموح');
    const cols = plan.config.columns;
    const oldIdOf = new Map(); idMap.forEach((nw, old) => oldIdOf.set(nw, old));
    let dropped = 0;
    const seenRid = new Set();
    plan.records = rawRecs.filter(U.isPlainObject).map(rr => {
      const rec = Model.newRecord(plan, false);
      if (typeof rr.id === 'string' && /^[\w-]{3,60}$/.test(rr.id) && !seenRid.has(rr.id)) rec.id = rr.id;
      seenRid.add(rec.id);
      if (typeof rr.createdAt === 'string' && !isNaN(Date.parse(rr.createdAt))) rec.createdAt = rr.createdAt;
      if (typeof rr.updatedAt === 'string' && !isNaN(Date.parse(rr.updatedAt))) rec.updatedAt = rr.updatedAt;
      const rv = U.isPlainObject(rr.values) ? rr.values : {};
      cols.forEach(c => {
        if (FT.get(c.type).isCalc) return;
        let v = rv[oldIdOf.get(c.id) || c.id];
        if (v === undefined) v = rv[c.id];
        if (v === undefined || v === null || v === '') { rec.values[c.id] = null; return; }
        const r = FT.get(c.type).parse(v, c);
        if (r.error) { dropped++; rec.values[c.id] = null; } else rec.values[c.id] = r.value;
      });
      if (U.isPlainObject(rr.review) && ['pending', 'approved', 'rejected'].includes(rr.review.state)) {
        rec.review = { state: rr.review.state, by: Sanitize.str(rr.review.by, 100), at: Sanitize.str(rr.review.at, 40), note: Sanitize.str(rr.review.note, 500) };
      }
      return rec;
    });
    if (dropped) warnings.push('تم تجاهل ' + dropped + ' قيمة غير صالحة لنوع الحقل أثناء الاستيراد');
    return { plan, warnings };
  }
};

/* ---------------------- Spreadsheet import helpers ---------------------- */
const Import = {
  /** Map file headers to columns. Returns array of colId|null aligned with headers. */
  autoMap(headers, columns) {
    const cand = columns.filter(c => !FT.get(c.type).isCalc);
    const used = new Set();
    const res = headers.map(() => null);
    const norm = s => U.normalizeText(s).replace(/[\s_\-:()\/]+/g, '');
    headers.forEach((h, i) => {
      const nh = norm(h); if (!nh) return;
      const hit = cand.find(c => !used.has(c.id) && (norm(c.name) === nh || U.normalizeText(c.id) === nh));
      if (hit) { res[i] = hit.id; used.add(hit.id); }
    });
    headers.forEach((h, i) => {
      if (res[i]) return;
      const nh = norm(h); if (nh.length < 3) return;
      const hits = cand.filter(c => !used.has(c.id) && (norm(c.name).includes(nh) || nh.includes(norm(c.name))) && norm(c.name).length >= 3);
      if (hits.length === 1) { res[i] = hits[0].id; used.add(hits[0].id); }
    });
    return res;
  },

  /** Convert one spreadsheet cell ({v, kind}) to a typed value for a column. */
  coerce(cell, col) {
    let v = cell ? cell.v : null;
    if (v === null || v === undefined || (typeof v === 'string' && v.trim() === '')) return { value: null };
    const type = col.type;
    if (type === 'date' || type === 'datetime') {
      if (typeof v === 'number') {
        const iso = type === 'date' ? D.serialToISODate(Math.floor(v)) : D.serialToISODateTime(v);
        return { value: iso };
      }
      return FT.get(type).parse(v, col);
    }
    if (type === 'percentage' && typeof v === 'number') {
      if (cell.kind === 'percent') return { value: parseFloat((v * 100).toPrecision(12)) };
      return { value: v };
    }
    if (type === 'numeric' && typeof v === 'number') {
      // a cell formatted as % already holds a fraction (0.5 = 50%): keep it for scale 'excel', scale up for '0-100'
      if (cell.kind === 'percent' && col.percentScale === '0-100') return { value: parseFloat((v * 100).toPrecision(12)) };
      return { value: v };
    }
    if ((type === 'text' || type === 'longtext') && typeof v === 'number') return { value: String(v) };
    if (type === 'boolean' && typeof v === 'number') return { value: v !== 0 };
    if (typeof v === 'number' && ['number', 'decimal', 'currency', 'percentage', 'numeric'].includes(type)) return FT.get(type).parse(v, col);
    return FT.get(type).parse(typeof v === 'string' ? v : String(v), col);
  },

  recordKey(rec, cols) {
    return cols.map(c => {
      const v = rec.values[c.id];
      return U.normalizeText(Array.isArray(v) ? v.join('|') : (v === null || v === undefined ? '' : v));
    }).join('\u241F');
  }
};

/* ---------- Toasts / busy ---------- */
function toast(msg, kind, ms) {
  const t = h('div', { class: 'toast ' + (kind || ''), role: 'status' }, icon(kind === 'err' ? 'warn' : kind === 'ok' ? 'check-circle' : 'info'), h('span', { text: msg }));
  const root = $('#toasts'); root.appendChild(t);
  while (root.children.length > 4) root.removeChild(root.firstChild);
  setTimeout(() => { t.remove(); }, ms || (kind === 'err' ? 6500 : 3600));
}
let busyCount = 0;
function busy(on, msg) {
  busyCount = Math.max(0, busyCount + (on ? 1 : -1));
  if (msg) $('#busy-t').textContent = msg;
  $('#busy').hidden = busyCount === 0;
}
async function withBusy(msg, fn) {
  busy(true, msg);
  try { await new Promise(r => setTimeout(r, 30)); return await fn(); }
  finally { busy(false); }
}

/* ---------- Dialogs ---------- */
const Dlg = {
  open(opts) {
    const dlg = h('dialog', { class: 'dlg ' + (opts.size || ''), a: { 'aria-label': opts.title || 'نافذة' } });
    const body = h('div', { class: 'dlg-b' }, opts.body);
    const head = h('div', { class: 'dlg-h' }, h('h2', { text: opts.title || '' }),
      h('button', { type: 'button', class: 'btn icon sm ghost', a: { 'aria-label': 'إغلاق' }, onclick: () => api.close(null) }, icon('x')));
    const foot = opts.footer && opts.footer.length ? h('div', { class: 'dlg-f' }, opts.footer) : null;
    dlg.appendChild(h('div', { class: 'dlg-in' }, head, body, foot));
    $('#modal-root').appendChild(dlg);
    let result = null, closed = false;
    const api = {
      el: dlg, body, foot,
      close(r) { result = r === undefined ? null : r; if (dlg.open) { try { dlg.close(); } catch (e) { dlg.removeAttribute('open'); finish(); } } else finish(); },
      setFooter(items) { if (foot) { clear(foot); appendKids(foot, items); } }
    };
    function finish() {
      if (closed) return; closed = true; dlg.remove();
      if (opts.onClose) opts.onClose(result);
      if (api._resolve) api._resolve(result);
    }
    dlg.addEventListener('close', finish);
    dlg.addEventListener('cancel', e => { if (opts.persistent) e.preventDefault(); });
    api.promise = new Promise(r => { api._resolve = r; });
    try { dlg.showModal(); } catch (e) { dlg.setAttribute('open', ''); }
    hydrateIcons(dlg);
    const first = opts.focus ? $(opts.focus, dlg) : $('input:not([type=hidden]),select,textarea', body);
    if (first && !window.matchMedia('(max-width:720px)').matches) setTimeout(() => { try { first.focus(); } catch (e) { /* noop */ } }, 30);
    return api;
  },

  /** Confirmation dialog. opts.typeToConfirm forces typing a phrase (for destructive actions). */
  confirm(opts) {
    return new Promise(resolve => {
      let input = null;
      const body = h('div', { class: 'grid' },
        h('p', { text: opts.message }),
        opts.detail ? h('p', { class: 'muted small', text: opts.detail }) : null,
        opts.typeToConfirm ? h('div', { class: 'field' },
          h('label', { text: 'للتأكيد اكتب العبارة التالية: «' + opts.typeToConfirm + '»' }),
          input = h('input', { type: 'text', autocomplete: 'off', oninput: () => { ok.disabled = input.value.trim() !== opts.typeToConfirm; } })) : null);
      const ok = btn(opts.confirmLabel || 'تأكيد', { cls: opts.danger ? 'danger' : 'primary', onClick: () => d.close(true), disabled: !!opts.typeToConfirm });
      const d = Dlg.open({
        title: opts.title || 'تأكيد الإجراء', size: 'narrow', body,
        footer: [ok, btn('إلغاء', { onClick: () => d.close(false) })], onClose: r => resolve(r === true)
      });

  },

  prompt(opts) {
    return new Promise(resolve => {
      const input = h('input', { type: 'text', value: opts.value || '', maxLength: opts.maxLength || 200, onkeydown: e => { if (e.key === 'Enter') { e.preventDefault(); go(); } } });
      const err = h('div', { class: 'err', text: '' });

        footer: [btn(opts.okLabel || 'حفظ', { cls: 'primary', onClick: go }), btn('إلغاء', { onClick: () => d.close(null) })],
        onClose: r => resolve(typeof r === 'string' ? r : null)

/* ---------- Floating menu ---------- */
const Menu = {
  _el: null,
  close() { if (Menu._el) { Menu._el.remove(); Menu._el = null; document.removeEventListener('pointerdown', Menu._out, true); document.removeEventListener('keydown', Menu._key, true); } },
  _out(e) { if (Menu._el && !Menu._el.contains(e.target)) Menu.close(); },
  _key(e) { if (e.key === 'Escape') { const a = Menu._anchor; Menu.close(); if (a) a.focus(); } },
  open(anchor, items) {
    Menu.close();
    Menu._anchor = anchor;
    const pop = h('div', { class: 'pop', role: 'menu' });
    items.forEach(it => {
      if (!it) return;
      if (it.sep) { pop.appendChild(h('hr')); return; }
      if (it.header) { pop.appendChild(h('div', { class: 'ph', text: it.header })); return; }
      pop.appendChild(h('button', {
        type: 'button', class: 'mi' + (it.danger ? ' danger' : ''), role: 'menuitem', disabled: !!it.disabled,
        onclick: () => { Menu.close(); if (it.onClick) it.onClick(); }
      }, it.icon ? icon(it.icon) : null, h('span', { text: it.label })));
    });
    pop.style.position = 'fixed'; pop.style.visibility = 'hidden';
    document.body.appendChild(pop);
    const r = anchor.getBoundingClientRect(), pw = pop.offsetWidth, ph = pop.offsetHeight;
    let left = r.right - pw; if (left < 8) left = Math.min(8, window.innerWidth - pw - 8); if (left + pw > window.innerWidth - 8) left = window.innerWidth - pw - 8;
    let top = r.bottom + 4; if (top + ph > window.innerHeight - 8) top = Math.max(8, r.top - ph - 4);
    pop.style.left = Math.max(8, left) + 'px'; pop.style.top = top + 'px'; pop.style.visibility = '';
    Menu._el = pop;
    setTimeout(() => { document.addEventListener('pointerdown', Menu._out, true); document.addEventListener('keydown', Menu._key, true); }, 0);
    hydrateIcons(pop);
    const f = $('button:not(:disabled)', pop); if (f) f.focus();
  }
};

const LIBS = {
  xlsx: { test: () => window.XLSX, urls: ['https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js', 'https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js'], name: 'SheetJS (مكتبة Excel)' },
  chart: { test: () => window.Chart, urls: ['https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js', 'https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.js'], name: 'Chart.js (الرسوم البيانية)' },
  exceljs: { test: () => window.ExcelJS, urls: ['https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js', 'https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js'], name: 'ExcelJS (قراءة هيكل ملفات Excel)' },
  docx: { test: () => window.docx, urls: ['https://cdn.jsdelivr.net/npm/docx@8.5.0/build/index.umd.js', 'https://cdnjs.cloudflare.com/ajax/libs/docx/8.5.0/docx.min.js'], name: 'docx (ملفات Word)' }
};
const libPromises = {};
function loadLib(key) {
  const L = LIBS[key];
  if (L.test()) return Promise.resolve(true);
  if (libPromises[key]) return libPromises[key];
  libPromises[key] = (async () => {
    for (const url of L.urls) {
      try {
        await new Promise((res, rej) => {
          const s = document.createElement('script'); s.src = url; s.async = true;
          s.onload = res; s.onerror = () => rej(new Error('load')); document.head.appendChild(s);
        });
        if (L.test()) return true;
      } catch (e) { /* try next mirror */ }
    }
    delete libPromises[key];
    throw new Error('تعذّر تحميل المكتبة ' + L.name + '. تأكد من اتصالك بالإنترنت ثم أعد المحاولة.');
  })();
  return libPromises[key];
}

/* ---------- File saving (works on GitHub Pages and inside the Claude viewer) ---------- */
let DL_CAP = null;
try { DL_CAP = (window.claude && typeof window.claude.use === 'function') ? window.claude.use('downloads').catch(() => null) : null; } catch (e) { DL_CAP = null; }

async function saveFile(filename, data, mime) {
  const blob = (data instanceof Blob) ? data : new Blob([data], { type: mime || 'application/octet-stream' });
  try {
    const cap = DL_CAP ? await DL_CAP : null;
    if (cap) { await cap.save({ filename, data: blob }); return true; }
  } catch (e) {
    if (e && e.code === 'declined') return false;
    if (e && e.code === 'rejected_extension') { toast('نوع الملف غير مسموح في هذه البيئة', 'err'); return false; }
  }
  const url = URL.createObjectURL(blob);
  const a = h('a', { href: url, download: filename, style: 'display:none' });
  document.body.appendChild(a); a.click();
  setTimeout(() => { a.remove(); URL.revokeObjectURL(url); }, 4000);
  return true;
}

/* ---------- Persistence layer (swap this adapter for a REST/SQL backend later) ----------
   Contract (all async):
     init, listPlans, savePlan(planWithoutRecords), deletePlan(id), getRecords(planId),
     putRecords(planId, recs), deleteRecords(planId, ids), replaceRecords(planId, recs),
     addAudit(entries), getAudit(planId), clearAudit(planId), kvGet(key), kvSet(key, value)
   ------------------------------------------------------------------------------------- */
function createMemoryAdapter() {
  const plans = new Map(), recs = new Map(), audits = [], kv = new Map();
  return {
    kind: 'memory',
    async init() {},
    async listPlans() { return Array.from(plans.values()).map(U.clone); },
    async savePlan(p) { plans.set(p.id, U.clone(p)); },
    async deletePlan(id) { plans.delete(id); recs.delete(id); for (let i = audits.length - 1; i >= 0; i--) if (audits[i].planId === id) audits.splice(i, 1); },
    async getRecords(id) { return U.clone(Array.from((recs.get(id) || new Map()).values())); },
    async putRecords(id, list) { if (!recs.has(id)) recs.set(id, new Map()); list.forEach(r => recs.get(id).set(r.id, U.clone(r))); },
    async deleteRecords(id, ids) { const m = recs.get(id); if (m) ids.forEach(x => m.delete(x)); },
    async replaceRecords(id, list) { recs.set(id, new Map(list.map(r => [r.id, U.clone(r)]))); },
    async addAudit(es) { es.forEach(e => audits.push(U.clone(e))); },
    async getAudit(id) { return audits.filter(a => a.planId === id).reverse(); },
    async clearAudit(id) { for (let i = audits.length - 1; i >= 0; i--) if (audits[i].planId === id) audits.splice(i, 1); },
    async kvGet(k) { return kv.get(k); },
    async kvSet(k, v) { kv.set(k, v); }
  };
}

function createIDBAdapter(dbName) {
  let db = null;
  const req = r => new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
  const txDone = t => new Promise((res, rej) => { t.oncomplete = () => res(); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error || new Error('abort')); });
  return {
    kind: 'indexeddb',
    async init() {
      if (!window.indexedDB) throw new Error('IndexedDB unavailable');
      db = await new Promise((res, rej) => {
        const o = indexedDB.open(dbName, 1);
        o.onupgradeneeded = () => {
          const d = o.result;
          d.createObjectStore('plans', { keyPath: 'id' });
          const r = d.createObjectStore('records', { keyPath: '_k' }); r.createIndex('planId', 'planId');
          const a = d.createObjectStore('audit', { keyPath: 'id' }); a.createIndex('planId', 'planId');
          d.createObjectStore('kv', { keyPath: 'key' });
        };
        o.onsuccess = () => res(o.result); o.onerror = () => rej(o.error); o.onblocked = () => rej(new Error('blocked'));
      });
      // probe write to detect restricted storage modes
      const t = db.transaction('kv', 'readwrite'); t.objectStore('kv').put({ key: '__probe', value: 1 }); await txDone(t);
    },
    async listPlans() { return req(db.transaction('plans').objectStore('plans').getAll()); },
    async savePlan(p) { const t = db.transaction('plans', 'readwrite'); t.objectStore('plans').put(p); await txDone(t); },
    async deletePlan(id) {
      const t = db.transaction(['plans', 'records', 'audit'], 'readwrite');
      t.objectStore('plans').delete(id);
      ['records', 'audit'].forEach(sn => {
        const c = t.objectStore(sn).index('planId').openKeyCursor(IDBKeyRange.only(id));
        c.onsuccess = () => { const cur = c.result; if (cur) { t.objectStore(sn).delete(cur.primaryKey); cur.continue(); } };
      });
      await txDone(t);
    },
    async getRecords(id) {
      const all = await req(db.transaction('records').objectStore('records').index('planId').getAll(IDBKeyRange.only(id)));
      return all.map(r => { const o = Object.assign({}, r); delete o._k; delete o.planId; return o; });
    },
    async putRecords(id, list) { if (!list.length) return; const t = db.transaction('records', 'readwrite'); const s = t.objectStore('records'); list.forEach(r => s.put(Object.assign({}, r, { planId: id, _k: id + ':' + r.id }))); await txDone(t); },
    async deleteRecords(id, ids) { if (!ids.length) return; const t = db.transaction('records', 'readwrite'); const s = t.objectStore('records'); ids.forEach(x => s.delete(id + ':' + x)); await txDone(t); },
    async replaceRecords(id, list) {
      const t = db.transaction('records', 'readwrite'); const s = t.objectStore('records');
      const c = s.index('planId').openKeyCursor(IDBKeyRange.only(id));
      c.onsuccess = () => {
        const cur = c.result;
        if (cur) { s.delete(cur.primaryKey); cur.continue(); }
        else list.forEach(r => s.put(Object.assign({}, r, { planId: id, _k: id + ':' + r.id })));
      };
      await txDone(t);
    },
    async addAudit(es) { if (!es.length) return; const t = db.transaction('audit', 'readwrite'); es.forEach(e => t.objectStore('audit').put(e)); await txDone(t); },
    async getAudit(id) { const all = await req(db.transaction('audit').objectStore('audit').index('planId').getAll(IDBKeyRange.only(id))); return all.sort((a, b) => (a.ts < b.ts ? 1 : a.ts > b.ts ? -1 : (a.seq < b.seq ? 1 : -1))); },
    async clearAudit(id) { const t = db.transaction('audit', 'readwrite'); const s = t.objectStore('audit'); const c = s.index('planId').openKeyCursor(IDBKeyRange.only(id)); c.onsuccess = () => { const cur = c.result; if (cur) { s.delete(cur.primaryKey); cur.continue(); } }; await txDone(t); },
    async kvGet(k) { const r = await req(db.transaction('kv').objectStore('kv').get(k)); return r ? r.value : undefined; },
    async kvSet(k, v) { const t = db.transaction('kv', 'readwrite'); t.objectStore('kv').put({ key: k, value: v }); await txDone(t); }
  };
}

const Store = {
  a: null, mode: 'indexeddb', q: Promise.resolve(), failed: false,
  async init(dbName) {
    try { Store.a = createIDBAdapter(dbName); await Store.a.init(); Store.mode = 'indexeddb'; }
    catch (e) { Store.a = createMemoryAdapter(); Store.mode = 'memory'; }
  },
  /** serialise writes so they land in order; surface the first failure once */
  run(fn) {
    Store.q = Store.q.then(fn).catch(err => {
      if (!Store.failed) { Store.failed = true; toast('تعذّر حفظ البيانات في المتصفح. صدّر نسخة JSON احتياطية الآن.', 'err', 9000); }
      console.error(err);
    });
    return Store.q;
  },
  flush() { return Store.q; }
};

/* ---------- Persistence helpers ---------- */
function planHeader(plan) {
  const hdr = Object.assign({}, plan); delete hdr.records;
  hdr.recordCount = plan.records.length;
  return U.clone(hdr);
}
function syncPlansList() {
  if (!S.plan) return;
  const hdr = planHeader(S.plan);
  const i = S.plans.findIndex(p => p.id === hdr.id);
  if (i >= 0) S.plans[i] = hdr; else S.plans.push(hdr);
}
function persistPlanNow() {
  if (!S.plan) return;
  syncPlansList();
  const hdr = planHeader(S.plan);
  Store.run(() => Store.a.savePlan(hdr));
}
const persistPlan = U.debounce(persistPlanNow, 350);
function touch() { if (S.plan) { S.plan.updatedAt = U.nowISO(); persistPlan(); } }
function saveRecords(recs) { const c = U.clone(recs); const id = S.plan.id; Store.run(() => Store.a.putRecords(id, c)); persistPlan(); }
function removeRecordsFromStore(ids) { const id = S.plan.id; Store.run(() => Store.a.deleteRecords(id, ids.slice())); persistPlan(); }

function migratePlan(plan) {
  plan.config = plan.config || {};
  const c = plan.config;
  c.columns = Array.isArray(c.columns) ? c.columns : [];
  c.rules = Array.isArray(c.rules) ? c.rules : [];
  c.summaries = Array.isArray(c.summaries) ? c.summaries : [];
  c.filterPresets = Array.isArray(c.filterPresets) ? c.filterPresets : [];
  c.reports = Array.isArray(c.reports) ? c.reports : [];
  c.settings = c.settings || { pageSize: 25 };
  c.view = c.view || {}; c.view.filters = c.view.filters || {}; c.view.hidden = c.view.hidden || []; c.view.search = c.view.search || '';
  if (!('sort' in c.view)) c.view.sort = null;
  if (!('activeReportId' in c.view)) c.view.activeReportId = null;
  plan.records = Array.isArray(plan.records) ? plan.records : [];
  Model.reindex(plan);
  return plan;
}

/* ---------- Plan lifecycle ---------- */
function resetPlanUI() {
  UI.d.page = 1; UI.d.sel = new Set(); UI.d.editId = null; UI.d.draft = null; UI.d.openCards = new Set(); UI.d.allSel = false; UI.d.showFilters = false;
  Object.values(UI.r.charts).forEach(c => { try { c.destroy(); } catch (e) { /* noop */ } });
  UI.r = { filters: {}, search: '', ready: false, charts: {}, chartImgs: {}, extra: new Set(), section: null };
}

async function openPlan(id, goto) {
  const hdr = S.plans.find(p => p.id === id);
  if (!hdr) return;
  await Store.flush();
  const plan = U.clone(hdr);
  plan.records = await Store.a.getRecords(id);
  migratePlan(plan);
  S.plan = plan; resetPlanUI(); recompute();
  Store.run(() => Store.a.kvSet('lastPlan', id));

}

async function createPlan(meta, template) {

  S.plan = plan; resetPlanUI(); migratePlan(plan); recompute();
  Audit.log('plan.create', { note: plan.name });

  Store.run(() => Store.a.kvSet('lastPlan', plan.id));
  refreshChrome();

}

/** Install a fully built plan object (columns, rules, records already filled): persist it and make it the current plan. */
async function installPlan(plan) {

async function duplicatePlan(id) {
  await Store.flush();
  let src;
  if (S.plan && S.plan.id === id) src = U.clone(S.plan);
  else { const hdr = S.plans.find(p => p.id === id); if (!hdr) return; src = U.clone(hdr); src.records = await Store.a.getRecords(id); }
  const cp = U.clone(src);
  cp.id = U.uid('plan'); cp.name = U.textLimit(src.name + ' (نسخة)', 200); cp.createdAt = cp.updatedAt = U.nowISO();
  cp.status = cp.status === 'archived' ? 'draft' : cp.status;
  cp.records.forEach(r => { r.id = U.uid('r'); });
  cp.config.reports = (cp.config.reports || []).map(r => Object.assign(r, { id: U.uid('rep') }));
  cp.config.view = Object.assign(cp.config.view || {}, { activeReportId: null });
  const hdr = planHeader(cp);
  Store.run(async () => { await Store.a.savePlan(hdr); await Store.a.putRecords(cp.id, cp.records); });
  S.plans.push(hdr);

async function deletePlanById(id) {

}

/* ---------- Package (backup) ---------- */
function buildPackage(plan, opts) {
  opts = opts || {};
  const hdr = Object.assign({}, plan); delete hdr.records;
  return {
    format: PACKAGE_FORMAT, version: 1, app: 'SPMERS', exportedAt: U.nowISO(),
    plan: U.clone(hdr),
    data: { records: opts.noData ? [] : U.clone(plan.records) }
  };

/** Import a parsed JSON package. mode: 'new' | 'replace' (replace current plan content, keeping its id). */
async function applyImportedPackage(pkg, mode) {
  const { plan: np, warnings } = Sanitize.package(pkg, false);
  if (mode === 'replace' && S.plan) {
    np.id = S.plan.id; np.createdAt = S.plan.createdAt;
  }
  np.updatedAt = U.nowISO();
  const wasCurrent = S.plan && S.plan.id === np.id;
  Store.run(async () => { await Store.a.savePlan(planHeader(np)); await Store.a.replaceRecords(np.id, np.records); });
  S.plans = S.plans.filter(p => p.id !== np.id); S.plans.push(planHeader(np));
  S.plan = np; resetPlanUI(); migratePlan(np); recompute();
  Audit.log('plan.import', { planId: np.id, note: (mode === 'replace' ? 'استبدال: ' : 'استيراد: ') + np.name + ' — ' + np.records.length + ' سجل' });
  Audit.flush();
  Store.run(() => Store.a.kvSet('lastPlan', np.id));
  refreshChrome();
  return { plan: np, warnings, wasCurrent };
}

/* ---------- Record operations ---------- */
function recSummary(rec) {
  const cols = planCols().filter(c => !FT.get(c.type).isCalc);
  for (const c of cols) { const v = rec.values[c.id]; if (!U.isBlank(v)) return FT.get(c.type).format(v, c); }
  return rec.id;
}
function sameVal(a, b) { return JSON.stringify(a === undefined ? null : a) === JSON.stringify(b === undefined ? null : b); }

function commitRecord(recId, values) {
  const p = S.plan;
  let rec = recId ? p.records.find(r => r.id === recId) : null;
  const now = U.nowISO();
  if (!rec) {
    rec = Model.newRecord(p, false);
    rec.values = values; p.records.push(rec);
    Audit.log('record.create', { recordId: rec.id, note: recSummary(rec) });
  } else {
    p.config.columns.forEach(c => {
      if (FT.get(c.type).isCalc) return;
      const o = rec.values[c.id], n = values[c.id];
      if (!sameVal(o, n)) Audit.log('record.update', { recordId: rec.id, field: c.name, oldValue: FT.get(c.type).format(o, c) || null, newValue: FT.get(c.type).format(n, c) || null });
    });
    rec.values = values; rec.updatedAt = now;
    if (rec.review && rec.review.state === 'approved') rec.review = { state: 'pending', by: '', at: now, note: 'أُعيدت للمراجعة بعد التعديل' };
  }
  rec.updatedAt = now;
  saveRecords([rec]); recompute(); touch();
  return rec;
}

function deleteRecordsByIds(ids) {
  const p = S.plan; const set = new Set(ids);
  p.records.filter(r => set.has(r.id)).forEach(r => Audit.log('record.delete', { recordId: r.id, note: recSummary(r) }));
  p.records = p.records.filter(r => !set.has(r.id));
  removeRecordsFromStore(ids); recompute(); touch();
  ids.forEach(i => UI.d.sel.delete(i));
}

function duplicateRecordsByIds(ids) {
  const p = S.plan; const out = [];
  ids.forEach(id => {
    const r = p.records.find(x => x.id === id); if (!r) return;
    const c = U.clone(r); c.id = U.uid('r'); c.createdAt = c.updatedAt = U.nowISO(); c.review = null;
    const idx = p.records.indexOf(r); p.records.splice(idx + 1, 0, c); out.push(c);
    Audit.log('record.duplicate', { recordId: c.id, note: 'نسخة من: ' + recSummary(r) });
  });
  saveRecords(out); recompute(); touch();
  return out;
}

function setReview(ids, state, note) {
  const p = S.plan; const changed = [];
  ids.forEach(id => {
    const r = p.records.find(x => x.id === id); if (!r) return;
    r.review = { state, by: ROLES[S.role].label, at: U.nowISO(), note: note || '' };
    Audit.log('record.review', { recordId: r.id, field: 'المراجعة', newValue: state === 'approved' ? 'معتمد' : state === 'rejected' ? 'مرفوض' : 'قيد المراجعة', note: recSummary(r) });
    changed.push(r);
  });
  saveRecords(changed); touch();
}

function resetPlanData() {
  const n = S.plan.records.length;
  S.plan.records = []; recompute();
  const id = S.plan.id; Store.run(() => Store.a.replaceRecords(id, []));
  Audit.log('data.reset', { note: 'حُذف ' + n + ' سجل مع الإبقاء على هيكل الخطة' });
  UI.d.sel = new Set(); UI.d.page = 1; touch(); persistPlanNow();
}

/* ---------- Column operations ---------- */
function columnDependents(colId) {
  const p = S.plan; const out = { calc: [], rules: [], reports: [] };
  p.config.columns.forEach(c => { if (c.id !== colId && FT.get(c.type).isCalc && FX.refsOf(c.formula || '').includes(colId)) out.calc.push(c.name); });
  p.config.rules.forEach(r => { if (FX.refsOf(r.expr || '').includes(colId)) out.rules.push(r.name || 'قاعدة'); });
  p.config.reports.forEach(r => { if (JSON.stringify(r.sections || []).includes('"' + colId + '"')) out.reports.push(r.name); });
  return out;
}

function stripColumnFromReports(plan, colId) {
  const scrub = o => {
    if (Array.isArray(o)) return o.map(scrub).filter(x => x !== colId);
    if (o && typeof o === 'object') { const r = {}; Object.keys(o).forEach(k => { if (k === colId) return; r[k] = (o[k] === colId) ? null : scrub(o[k]); }); return r; }
    return o;
  };
  plan.config.reports = plan.config.reports.map(scrub);
}

/** Add or update a column. `renames` maps old option label -> new label for select fields. */
function saveColumn(col, isNew, renames) {
  const p = S.plan;
  if (isNew) {
    col.order = p.config.columns.length;
    p.config.columns.push(col);
    Audit.log('column.add', { field: col.name, newValue: FT.get(col.type).label });
  } else {
    const i = p.config.columns.findIndex(c => c.id === col.id);
    const old = p.config.columns[i];
    const typeChanged = old.type !== col.type;
    p.config.columns[i] = col;
    let lost = 0;
    const touched = [];
    if (FT.get(col.type).isCalc) {
      p.records.forEach(r => { if (r.values[col.id] !== undefined) { delete r.values[col.id]; touched.push(r); } });
    } else if (typeChanged || (renames && Object.keys(renames).length)) {
      p.records.forEach(r => {
        let v = r.values[col.id];
        if (renames && Array.isArray(v)) v = v.map(x => renames[x] !== undefined ? renames[x] : x);
        else if (renames && typeof v === 'string' && renames[v] !== undefined) v = renames[v];
        if (typeChanged && !U.isBlank(v)) {
          const asText = Array.isArray(v) ? v.join('، ') : (typeof v === 'boolean' ? (v ? 'نعم' : 'لا') : (FT.get(old.type).isCalc ? '' : FT.get(old.type).format(v, old)));
          const rawIn = (['number', 'decimal', 'percentage', 'currency'].includes(old.type) && ['number', 'decimal', 'percentage', 'currency'].includes(col.type)) ? v : (['date', 'datetime'].includes(old.type) ? v : asText);
          const pr = FT.get(col.type).parse(rawIn, col);
          if (pr.error) { lost++; v = null; } else v = pr.value;
        }
        if (!sameVal(v, r.values[col.id])) { r.values[col.id] = v; touched.push(r); }
      });
    }
    if (touched.length) saveRecords(touched);
    Audit.log('column.edit', { field: col.name, note: typeChanged ? 'تغيير النوع إلى ' + FT.get(col.type).label + (lost ? ' (تعذّر تحويل ' + lost + ' قيمة)' : '') : '' });
    if (lost) toast('تعذّر تحويل ' + lost + ' قيمة إلى النوع الجديد وتم تفريغها', 'warn', 6000);
  }
  Model.reindex(p); recompute(); touch();
}

function deleteColumnById(colId) {
  const p = S.plan; const col = p.config.columns.find(c => c.id === colId); if (!col) return;
  p.config.columns = p.config.columns.filter(c => c.id !== colId);
  p.config.rules = p.config.rules.filter(r => !FX.refsOf(r.expr || '').includes(colId));
  delete p.config.view.filters[colId];
  p.config.view.hidden = p.config.view.hidden.filter(x => x !== colId);
  if (p.config.view.sort && p.config.view.sort.colId === colId) p.config.view.sort = null;
  p.config.filterPresets.forEach(f => { delete f.filters[colId]; });
  stripColumnFromReports(p, colId);
  p.records.forEach(r => { delete r.values[colId]; });
  Store.run(() => Store.a.replaceRecords(p.id, U.clone(p.records)));
  Model.reindex(p);
  Audit.log('column.delete', { field: col.name });
  recompute(); touch();
}

function duplicateColumnById(colId) {
  const p = S.plan; const src = p.config.columns.find(c => c.id === colId); if (!src) return null;
  const cp = U.clone(src);
  cp.id = U.uid('f').replace('f_', 'f');
  let n = src.name + ' (نسخة)', k = 2;
  while (p.config.columns.some(c => U.normalizeText(c.name) === U.normalizeText(n))) n = src.name + ' (نسخة ' + (k++) + ')';
  cp.name = n; cp.order = src.order + 0.5;
  p.config.columns.push(cp); Model.reindex(p);
  if (!FT.get(cp.type).isCalc) { p.records.forEach(r => { r.values[cp.id] = U.clone(r.values[src.id]); }); saveRecords(p.records); }
  Audit.log('column.duplicate', { field: cp.name, note: 'نسخة من: ' + src.name });
  recompute(); touch();
  return cp;
}

function moveColumn(colId, targetId, after) {
  const p = S.plan; const list = Model.sortedColumns(p);
  const from = list.findIndex(c => c.id === colId); if (from < 0) return;
  const [it] = list.splice(from, 1);
  let to = list.findIndex(c => c.id === targetId);
  if (to < 0) to = list.length; else if (after) to++;
  list.splice(to, 0, it);
  list.forEach((c, i) => { c.order = i; });
  Audit.log('column.reorder', { field: it.name });
  touch();
}
function moveColumnBy(colId, dir) {
  const list = planCols(); const i = list.findIndex(c => c.id === colId); const j = i + dir;
  if (i < 0 || j < 0 || j >= list.length) return;
  moveColumn(colId, list[j].id, dir > 0);
}

/* ---------- Optional example template (user chooses it; nothing is built-in) ---------- */
const Templates = {

    const opts = arr => arr.map((l, i) => ({ label: l, color: OPTION_COLORS[i % OPTION_COLORS.length] }));
    const act = mk('text', 'النشاط', { required: true, filterable: true, width: 260 });

const MQ = window.matchMedia ? window.matchMedia('(max-width:720px)') : { matches: false, addEventListener() {} };
const isMobile = () => MQ.matches;

/** Readable formula: each [field name] is an isolated chip so Arabic names never scramble the operators. */
function fxDisplay(text) {
  const out = h('span');
  String(text).split(/(\[[^\]]*\])/).forEach(part => {
    if (!part) return;
    if (part[0] === '[' && part[part.length - 1] === ']') out.appendChild(h('bdi', { class: 'fx-ref', text: part.slice(1, -1) }));
    else out.appendChild(document.createTextNode(part));
  });
  return out;
}

function optColor(col, label) {
  const o = (col.options || []).find(x => x.label === label);
  return o ? o.color : '#718096';
}

/* ---------- Input factory: one widget per field type ---------- */
function makeInput(col, value, opts) {
  opts = opts || {};
  const t = col.type; const id = opts.id || U.uid('in');
  const base = { id, placeholder: col.placeholder || '', a: { 'aria-label': col.name } };
  let el, read, write, focusEl;
  const fire = () => { if (opts.onInput) opts.onInput(); };
  const strVal = v => (v === null || v === undefined) ? '' : String(v);

  if (t === 'longtext') {
    el = h('textarea', Object.assign({}, base, { value: strVal(value), maxLength: col.maxLength || 5000, oninput: fire })); focusEl = el;
    read = () => el.value; write = v => { el.value = strVal(v); };
  } else if (t === 'date' || t === 'datetime') {
    el = h('input', Object.assign({}, base, { type: t === 'date' ? 'date' : 'datetime-local', value: strVal(value), onchange: fire, oninput: fire })); focusEl = el;
    read = () => el.value; write = v => { el.value = strVal(v); };
  } else if (t === 'boolean') {
    el = h('select', Object.assign({}, base, { onchange: fire }), h('option', { value: '', text: '—' }), h('option', { value: 'true', text: 'نعم' }), h('option', { value: 'false', text: 'لا' })); focusEl = el;
    write = v => { el.value = v === true ? 'true' : v === false ? 'false' : ''; }; write(value);
    read = () => el.value === '' ? null : el.value === 'true';
  } else if (t === 'select') {
    el = h('select', Object.assign({}, base, { onchange: fire }), h('option', { value: '', text: '— اختر —' }), (col.options || []).map(o => h('option', { value: o.label, text: o.label })));
    focusEl = el;
    // keep a legacy value visible even if no longer in the list, so it can be seen and fixed
    if (!U.isBlank(value) && !(col.options || []).some(o => o.label === value)) el.appendChild(h('option', { value: String(value), text: String(value) + ' (غير معرّف)' }));
    write = v => { el.value = strVal(v); }; write(value);
    read = () => el.value;
  } else if (t === 'multiselect') {
    const cur = new Set(Array.isArray(value) ? value : []);
    const boxes = (col.options || []).map(o => {
      const cb = h('input', { type: 'checkbox', value: o.label, checked: cur.has(o.label), onchange: fire });
      return h('label', { class: 'check' }, cb, h('span', { class: 'dot', style: 'background:' + o.color }), h('span', { text: o.label }));
    });
    el = h('div', { class: 'checks', id, role: 'group', a: { 'aria-label': col.name }, style: 'border:1px solid var(--line-strong);border-radius:8px;padding:6px 10px;background:var(--surface)' }, boxes);
    focusEl = $('input', el);
    read = () => $$('input:checked', el).map(i => i.value);
    write = v => { const s = new Set(Array.isArray(v) ? v : []); $$('input', el).forEach(i => { i.checked = s.has(i.value); }); };
  } else {
    const numeric = FT.get(t).isNumeric;
    el = h('input', Object.assign({}, base, { type: 'text', value: strVal(value), maxLength: numeric ? 40 : (col.maxLength || 500), oninput: fire }));
    if (numeric) { el.setAttribute('inputmode', 'decimal'); el.style.direction = 'ltr'; el.style.textAlign = 'right'; }
    focusEl = el;
    read = () => el.value; write = v => { el.value = strVal(v); };
  }
  return {
    el, colId: col.id,
    /** returns {value, error?} parsed according to the field type */
    get() { const raw = read(); return FT.get(t).parse(raw, col); },
    set: write, focus() { if (focusEl) focusEl.focus(); },
    mark(msg) { const target = (t === 'multiselect') ? el : el; target.classList.toggle('invalid', !!msg); if (msg) target.setAttribute('title', msg); else target.removeAttribute('title'); }
  };
}

/** Collect values from inputs and validate. Returns {values, issues, blocking}. */
function collectAndValidate(inputs, recId) {
  const p = S.plan; const values = {}; const issues = [];
  Object.keys(inputs).forEach(cid => {
    const col = p.config.columns.find(c => c.id === cid); if (!col) return;
    const r = inputs[cid].get();
    values[cid] = r.error ? r.value : r.value;
    if (r.error) issues.push({ colId: cid, message: '«' + col.name + '»: ' + r.error, severity: 'error' });
  });
  // keep values of non-editable columns unchanged
  const existing = recId ? p.records.find(r => r.id === recId) : null;
  p.config.columns.forEach(c => {
    if (FT.get(c.type).isCalc) return;
    if (!(c.id in values)) values[c.id] = existing ? U.clone(existing.values[c.id]) : (U.isBlank(c.defaultValue) ? null : U.clone(c.defaultValue));
  });
  const typedErr = new Set(issues.map(i => i.colId));
  const tmp = { id: recId || '__tmp', values };
  const others = p.records.filter(r => r.id !== tmp.id);
  const comp = FX.computeAll(p.config.columns, others.concat([tmp]));
  Validate.record(p, tmp, comp, others.concat([tmp])).forEach(i => { if (!(typedErr.has(i.colId) && i.severity === 'error' && i.message.indexOf('مطلوب') < 0)) issues.push(i); });
  const seen = new Set(); const uniq = issues.filter(i => { const k = i.colId + '|' + i.message; if (seen.has(k)) return false; seen.add(k); return true; });
  return { values, issues: uniq, blocking: uniq.some(i => i.severity === 'error') };
}

/* ---------- Cell display ---------- */
function cellNode(rec, col) {
  const t = FT.get(col.type);
  if (t.isCalc) {
    const row = S.computed.get(rec.id); const v = row ? row[col.id] : null;
    if (FX.isErr(v)) return h('span', { class: 'err', title: v.msg, text: '#خطأ' });
    return document.createTextNode(t.format(v, col));
  }
  const v = rec.values[col.id];

/* ---------- Desktop grid ---------- */
function colWidthStyle(c) { return c.width > 0 ? 'width:' + c.width + 'px;min-width:' + c.width + 'px;max-width:' + c.width + 'px' : ''; }

function renderGrid(rows, cols, editingNew) {
  const p = S.plan, v = viewState(); const edAny = can('structure');
  const showReview = !!p.config.settings.reviewEnabled;
  const table = h('table', { class: 'dt' });
  const sort = v.sort;
  const allOnPage = rows.length > 0 && rows.every(r => UI.d.sel.has(r.id));
  const headRow = h('tr');
  headRow.appendChild(h('th', { style: 'width:44px' }, h('input', { type: 'checkbox', checked: allOnPage, a: { 'aria-label': 'تحديد كل سجلات الصفحة' }, onchange: e => { rows.forEach(r => { if (e.target.checked) UI.d.sel.add(r.id); else UI.d.sel.delete(r.id); }); renderTable(); } })));
  headRow.appendChild(h('th', { style: 'width:96px', text: 'إجراءات' }));
  headRow.appendChild(h('th', { style: 'width:46px', text: '#' }));
  cols.forEach(c => {
    const th = h('th', { class: c.sortable ? 'sortable' : '', style: colWidthStyle(c), dataset: { id: c.id }, scope: 'col', title: c.group || null });
    const active = sort && sort.colId === c.id;
    if (active) th.setAttribute('aria-sort', sort.dir === 'desc' ? 'descending' : 'ascending');
    const inner = h('div', { class: 'th-in' }, h('span', { text: c.name }), FT.get(c.type).isCalc ? icon('calc') : null, c.required ? h('span', { class: 'muted', text: '*' }) : null,
      c.sortable ? h('span', { class: 'sorti' }, icon(active ? (sort.dir === 'desc' ? 'sort-desc' : 'sort-asc') : 'sort')) : null);
    if (c.sortable) { th.tabIndex = 0; const doSort = () => { const cur = v.sort; if (!cur || cur.colId !== c.id) v.sort = { colId: c.id, dir: 'asc' }; else if (cur.dir === 'asc') v.sort = { colId: c.id, dir: 'desc' }; else v.sort = null; persistView(); renderTable(); }; inner.addEventListener('click', doSort); th.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); doSort(); } }); }
    th.appendChild(inner);
    // resize handle
    const rz = h('span', { class: 'resizer', a: { 'aria-hidden': 'true' } });
    rz.addEventListener('pointerdown', e => {
      e.preventDefault(); e.stopPropagation(); rz.setPointerCapture(e.pointerId); rz.classList.add('act');
      const startX = e.clientX, startW = th.getBoundingClientRect().width; let w = startW;
      const move = ev => { w = U.clamp(startW + (startX - ev.clientX), 70, 800); th.style.width = th.style.minWidth = th.style.maxWidth = w + 'px'; };
      const up = () => { rz.removeEventListener('pointermove', move); rz.removeEventListener('pointerup', up); rz.classList.remove('act'); c.width = Math.round(w); touch(); renderTable(); };
      rz.addEventListener('pointermove', move); rz.addEventListener('pointerup', up);
    });
    rz.addEventListener('click', e => e.stopPropagation());
    th.appendChild(rz);
    // drag to reorder (administrators)
    if (edAny) {
      th.draggable = true;
      th.addEventListener('dragstart', e => { UI.d.dragCol = c.id; try { e.dataTransfer.setData('text/plain', c.id); } catch (x) { /* noop */ } });
      th.addEventListener('dragover', e => { if (UI.d.dragCol && UI.d.dragCol !== c.id) { e.preventDefault(); th.classList.add('drop-target'); } });
      th.addEventListener('dragleave', () => th.classList.remove('drop-target'));
      th.addEventListener('drop', e => { e.preventDefault(); th.classList.remove('drop-target'); if (UI.d.dragCol && UI.d.dragCol !== c.id) { moveColumn(UI.d.dragCol, c.id, false); UI.d.dragCol = null; renderData(); } });
    }
    headRow.appendChild(th);
  });
  if (showReview) headRow.appendChild(h('th', { text: 'المراجعة' }));
  table.appendChild(h('thead', null, headRow));
  const tb = h('tbody');
  if (editingNew) tb.appendChild(editRow(null, cols, showReview));
  const pageSize = p.config.settings.pageSize || 25; const base = (UI.d.page - 1) * pageSize;
  rows.forEach((r, i) => {
    if (UI.d.editId === r.id) { tb.appendChild(editRow(r, cols, showReview)); return; }
    const tr = h('tr', { class: UI.d.sel.has(r.id) ? 'sel' : '', dataset: { id: r.id } });
    tr.appendChild(h('td', null, h('input', { type: 'checkbox', checked: UI.d.sel.has(r.id), a: { 'aria-label': 'تحديد السجل' }, onchange: e => { if (e.target.checked) UI.d.sel.add(r.id); else UI.d.sel.delete(r.id); tr.classList.toggle('sel', e.target.checked); renderBulk(UI.d.lastAll); } })));

/* ---------- Inline row editing (Save / Cancel) ---------- */
function startNewRecord() {
  if (!requireCan('write')) return;
  if (!planCols().length) { toast('عرّف حقول الخطة أولاً', 'warn'); return; }
  if (isMobile()) { openRecordForm(null); return; }
  if (UI.d.editId) { toast('أنهِ التعديل الحالي (حفظ أو إلغاء) أولاً', 'warn'); return; }
  UI.d.editId = '__new'; UI.d.page = 1; renderTable();
  const f = $('tr.editing input, tr.editing select, tr.editing textarea'); if (f) f.focus();
}
function startEdit(id) {
  if (!requireCan('write')) return;
  if (isMobile()) { openRecordForm(id); return; }
  if (UI.d.editId && UI.d.editId !== id) { toast('أنهِ التعديل الحالي (حفظ أو إلغاء) أولاً', 'warn'); return; }
  UI.d.editId = id; renderTable();
  const f = $('tr.editing input:not([type=checkbox]), tr.editing select, tr.editing textarea'); if (f) f.focus();
}

function editRow(rec, cols, showReview) {
  const p = S.plan; const inputs = {}; UI.d.inputs = inputs;
  const tr = h('tr', { class: 'editing', dataset: { id: rec ? rec.id : '__new' } });
  const calcCells = {};
  const preview = U.debounce(() => {
    if (!planCols().some(c => FT.get(c.type).isCalc)) return;
    const vals = {}; Object.keys(inputs).forEach(cid => { vals[cid] = inputs[cid].get().value; });
    p.config.columns.forEach(c => { if (!FT.get(c.type).isCalc && !(c.id in vals)) vals[c.id] = rec ? rec.values[c.id] : null; });
    const tmp = { id: rec ? rec.id : '__tmp', values: vals };
    const comp = FX.computeAll(p.config.columns, p.records.filter(r => r.id !== tmp.id).concat([tmp]));
    Object.keys(calcCells).forEach(cid => { const col = p.config.columns.find(c => c.id === cid); const val = comp.get(tmp.id)[cid]; calcCells[cid].textContent = FX.isErr(val) ? '#خطأ' : FT.get(col.type).format(val, col); });
  }, 120);

function excelCell(rec, col) {
  const t = FT.get(col.type); const val = Model.value(rec, col, S.computed);
  if (U.isBlank(val) && val !== 0 && val !== false) return null;
  if (t.isCalc) {
    const row = S.computed.get(rec.id); if (row && FX.isErr(row[col.id])) return { t: 's', v: '#خطأ' };
    const rf = col.resultFormat || 'number';
    if (typeof val === 'number') {
      if (rf === 'percentage') return { t: 'n', v: val / 100, z: '0.0%' };
      if (rf === 'percentfrac') return { t: 'n', v: val, z: '0.0%' };
      if (rf === 'date') return { t: 'n', v: val, z: 'dd/mm/yyyy' };
      return { t: 'n', v: val, z: rf === 'currency' ? '#,##0' : (Number.isInteger(val) ? '#,##0' : '#,##0.00') };
    }
    if (typeof val === 'boolean') return { t: 's', v: val ? 'نعم' : 'لا' };
    return { t: 's', v: String(val) };
  }
  switch (col.type) {
    case 'number': return { t: 'n', v: val, z: '#,##0' };
    case 'decimal': return { t: 'n', v: val, z: '#,##0.' + '0'.repeat(Math.max(1, Number(col.decimals) || 2)) };
    case 'currency': return { t: 'n', v: val, z: '#,##0' };
    case 'numeric': return { t: 'n', v: val, z: col.numberMode === 'percent' ? (col.percentScale === '0-100' ? '0.0"%"' : '0.0%') : (col.numberMode === 'integer' ? '#,##0' : 'General') };
    case 'percentage': return { t: 'n', v: val / 100, z: '0.0%' };
    case 'date': return { t: 'n', v: D.toSerial(val), z: 'dd/mm/yyyy' };
    case 'datetime': return { t: 'n', v: D.toSerial(val), z: 'dd/mm/yyyy hh:mm' };
    case 'boolean': return { t: 's', v: val ? 'نعم' : 'لا' };
    case 'multiselect': return { t: 's', v: Array.isArray(val) ? val.join('، ') : String(val) };
    default: return { t: 's', v: String(val) };
  }
}

function buildSheet(aoa) {
  const ws = {}; let maxC = 0;
  aoa.forEach((row, r) => row.forEach((cell, c) => {
    if (cell === null || cell === undefined) return;
    ws[XLSX.utils.encode_cell({ r, c })] = (typeof cell === 'object') ? cell : { t: typeof cell === 'number' ? 'n' : 's', v: cell };
    if (c > maxC) maxC = c;
  }));
  ws['!ref'] = XLSX.utils.encode_range({ s: { r: 0, c: 0 }, e: { r: Math.max(0, aoa.length - 1), c: maxC } });
  return ws;
}

/* ---------------------------- Excel import ---------------------------- */
function cellToObj(cell) {
  if (!cell || cell.t === 'z' || cell.t === 'e') return null;
  let kind = 'plain', v = cell.v;
  if (cell.t === 'n' && cell.z) {
    const z = String(cell.z).replace(/\[[^\]]*\]|"[^"]*"|\\./g, '');
    if (/%/.test(z)) kind = 'percent'; else if (/[dmyh]/i.test(z) && !/^[#0,.?\s]*$/.test(z)) kind = 'date';
  }
  if (cell.t === 'd' && v instanceof Date) { v = D.parseLooseDate(v); kind = 'plain'; }
  if (typeof v === 'string') { v = v.replace(/\u00A0/g, ' ').trim(); if (v === '') return cell.f ? { v: null, kind, f: String(cell.f) } : null; }
  return { v, kind, f: cell.f ? String(cell.f) : null };
}
function sheetToMatrix(ws) {
  if (!ws || !ws['!ref']) return [];
  const range = XLSX.utils.decode_range(ws['!ref']);
  if ((range.e.r - range.s.r) > 200000 || (range.e.c - range.s.c) > 300) throw new Error('حجم الورقة يتجاوز الحد المسموح');
  const rows = [];
  for (let r = range.s.r; r <= range.e.r; r++) {
    const row = [];
    for (let c = range.s.c; c <= range.e.c; c++) row.push(cellToObj(ws[XLSX.utils.encode_cell({ r, c })]));
    rows.push(row);
  }
  return rows;
}

/** Header row = the row whose cells match the plan's field names best (works for multi-row headers and title rows). */
function guessHeaderRow(rows, cols) {
  let best = -1, bestScore = 0;
  const limit = Math.min(rows.length, 30);
  for (let i = 0; i < limit; i++) {
    const r = rows[i]; if (!r.some(x => x && x.v !== null)) continue;
    const hs = r.map(x => (x && x.v !== null && typeof x.v === 'string') ? x.v.replace(/\s+/g, ' ').trim() : '');
    const m = Import.autoMap(hs, cols).filter(Boolean).length;
    if (m > bestScore) { bestScore = m; best = i; }
  }
  const need = Math.min(2, cols.filter(c => !FT.get(c.type).isCalc).length);
  if (best >= 0 && bestScore >= need) return { index: best, score: bestScore };
  return { index: rows.findIndex(r => r.some(x => x && x.v !== null)), score: 0 };
}

/* Markers are assembled from pieces so this source never contains a literal script tag
   or HTML comment opener (which would confuse the HTML parser / the generator's regexes). */
const SC_O = '<scr' + 'ipt', SC_C = '</scr' + 'ipt>';
const EMB_SLOT = '<!' + '--EMBED_SLOT--' + '>';
const EMB_RE = new RegExp(SC_O + ' type="application/json" id="spmers-embedded">[\\s\\S]*?' + SC_C);
const INLINE_RE = new RegExp(SC_O + ' data-inline-lib="[a-z]+">[\\s\\S]*?' + SC_C, 'g');

async function generateStandalone(o) {
  await withBusy('جارٍ توليد الملف المستقل…', async () => {
    const p = S.plan;
    let src = PRISTINE_HTML;
    src = src.replace(EMB_RE, () => EMB_SLOT);
    // drop libraries that an earlier standalone build inlined, so they are not duplicated
    src = src.replace(INLINE_RE, '');
    const payload = { generatedAt: U.nowISO(), packageId: U.uid('emb'), options: { lockRole: !!o.viewOnly, role: o.viewOnly ? 'viewer' : 'admin' }, package: buildPackage(p, { noData: !o.data }) };
    const json = JSON.stringify(payload).replace(/</g, '\\u003c').replace(/\u2028/g, '\\u2028').replace(/\u2029/g, '\\u2029');
    let libs = '';
    if (o.inline) {
      let failed = false;
      for (const key of Object.keys(LIBS)) {
        let txt = null;
        for (const url of LIBS[key].urls) { try { const r = await fetch(url); if (r.ok) { txt = await r.text(); break; } } catch (e) { /* next */ } }
        if (txt) libs += SC_O + ' data-inline-lib="' + key + '">' + txt.replace(/<\/script/gi, '<\\/script') + SC_C + '\n'; else failed = true;
      }
      if (failed) toast('تعذّر تضمين بعض المكتبات في هذه البيئة؛ سيحتاج الملف إلى الإنترنت لتلك الوظائف', 'warn', 8000);
    }
    const block = libs + SC_O + ' type="application/json" id="spmers-embedded">' + json + SC_C;
    if (src.indexOf(EMB_SLOT) >= 0) src = src.replace(EMB_SLOT, () => block);
    else { const at = src.indexOf(SC_O + '>'); src = at >= 0 ? src.slice(0, at) + block + '\n' + src.slice(at) : src; }
    src = src.replace(/<title>[\s\S]*?<\/title>/, () => '<title>' + p.name.replace(/[<>&]/g, '') + '</title>');
    const ok = await saveFile(safeFileName(o.name || p.name) + '.html', new Blob([src], { type: 'text/html' }));
    if (ok) { Audit.log('data.export', { note: 'ملف HTML مستقل' + (o.data ? ' (مع البيانات)' : ' (هيكل فقط)') + (o.viewOnly ? ' — عرض فقط' : '') }); toast('تم توليد الملف المستقل', 'ok'); }
  });
}
