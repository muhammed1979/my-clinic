const CHART_COLORS = ['#0E5A63', '#C58B2B', '#2B6CB0', '#B83232', '#6B46C1', '#1F7A4D', '#C05621', '#718096', '#0F9AAD', '#D69E2E', '#8A4F7D', '#4A5568'];
const AGG_LABELS = { count: 'العدد', sum: 'المجموع', avg: 'المتوسط', min: 'الأدنى', max: 'الأعلى', distinct: 'عدد القيم المختلفة' };
const CHART_TYPES = [['bar', 'أعمدة'], ['hbar', 'أعمدة أفقية'], ['stacked', 'أعمدة مكدّسة'], ['line', 'خطي'], ['area', 'مساحي'], ['pie', 'دائري'], ['doughnut', 'حلقي'], ['progress', 'مؤشرات تقدم']];
const AR_MONTHS = ['كانون الثاني', 'شباط', 'آذار', 'نيسان', 'أيار', 'حزيران', 'تموز', 'آب', 'أيلول', 'تشرين الأول', 'تشرين الثاني', 'كانون الأول'];
const COUNT_COL = '__count__';

function cssVar(n) { return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }

/* ---------- Keyword hints (only used to ORDER / COLOUR suggestions, never to require fields) ---------- */
const KW = {
  target: /(مستهدف|هدف|target|planned|مخطط)/, actual: /(منجز|انجاز|محقق|achiev|actual|فعلي)/, status: /(حاله|وضع|status|state)/,
  done: /(مكتمل|منجز|تم |completed|done|finished)/, late: /(متاخر|delayed|late|overdue)/, prog: /(قيد|جاري|in progress|ongoing)/, pending: /(لم يبدا|معلق|pending|not started|مؤجل)/
};
const nm = s => U.normalizeText(s) + ' ';

/* ---------- Bucketing ---------- */
function bucketsFor(rec, col, gran) {
  const t = FT.get(col.type);
  const v = Model.value(rec, col, S.computed);
  const BLANK = [{ key: '\u0000blank', label: '(غير محدد)', sort: Infinity, blank: true }];
  if (U.isBlank(v) && v !== 0 && v !== false) return BLANK;
  if (col.type === 'multiselect') {
    return (Array.isArray(v) ? v : [v]).map(x => ({ key: String(x), label: String(x), sort: (col.options || []).findIndex(o => o.label === x) }));
  }
  if (col.type === 'select') { const i = (col.options || []).findIndex(o => o.label === v); return [{ key: String(v), label: String(v), sort: i < 0 ? 999 : i }]; }
  if (col.type === 'boolean' || typeof v === 'boolean') return [{ key: String(v), label: v ? 'نعم' : 'لا', sort: v ? 0 : 1 }];
  if (t.isDate || (t.isCalc && col.resultFormat === 'date' && typeof v === 'number')) {
    const iso = t.isDate ? String(v).slice(0, 10) : D.serialToISODate(v);
    const y = +iso.slice(0, 4), m = +iso.slice(5, 7);
    if (gran === 'year') return [{ key: String(y), label: String(y), sort: y }];
    if (gran === 'quarter') { const q = Math.floor((m - 1) / 3) + 1; return [{ key: y + 'Q' + q, label: 'الربع ' + ['الأول', 'الثاني', 'الثالث', 'الرابع'][q - 1] + ' ' + y, sort: y * 10 + q }]; }
    if (gran === 'day') return [{ key: iso, label: D.fmtDate(iso), sort: D.toSerial(iso) }];
    return [{ key: y + '-' + D.pad(m), label: AR_MONTHS[m - 1] + ' ' + y, sort: y * 100 + m }];
  }
  if (typeof v === 'number') return [{ key: 'n' + v, label: FT.get(col.type).format(v, col) || String(v), sort: v, num: true }];
  const s = String(v);
  return [{ key: s, label: s, sort: s }];
}

/* ---------- Aggregation ---------- */
function newAcc() { return { n: 0, sum: 0, min: Infinity, max: -Infinity, set: new Set(), nn: 0 }; }
function accAdd(acc, v, isCount) {
  if (isCount) { acc.n++; return; }
  if (U.isBlank(v) && v !== 0 && v !== false) return;
  acc.n++; acc.set.add(Array.isArray(v) ? v.join('|') : v);
  const num = typeof v === 'number' ? v : (typeof v === 'boolean' ? NaN : U.parseNumber(v));
  if (!isNaN(num)) { acc.nn++; acc.sum += num; if (num < acc.min) acc.min = num; if (num > acc.max) acc.max = num; }
}
function accFinal(acc, agg) {
  switch (agg) {
    case 'sum': return acc.sum;
    case 'avg': return acc.nn ? acc.sum / acc.nn : 0;
    case 'min': return acc.nn ? acc.min : 0;
    case 'max': return acc.nn ? acc.max : 0;
    case 'distinct': return acc.set.size;
    default: return acc.n;
  }
}
function measureName(m, cols) {
  if (m.col === COUNT_COL || !m.col) return 'عدد السجلات';
  const c = cols.find(x => x.id === m.col); const n = c ? c.name : '؟';
  return m.agg === 'sum' ? n : AGG_LABELS[m.agg] + ': ' + n;
}
function fmtMeasure(m, v, cols) {
  if (typeof v !== 'number') return '';
  if (m.col === COUNT_COL || m.agg === 'count' || m.agg === 'distinct') return U.fmtNumber(v, 0);
  const c = cols.find(x => x.id === m.col);
  if (c && c.type === 'numeric' && m.agg !== 'count' && m.agg !== 'distinct') return NumericUtil.format(v, Object.assign({}, c, { decimals: (c.decimals === '' || c.decimals === null || c.decimals === undefined) ? (Number.isInteger(v) ? 0 : 2) : c.decimals }));
  if (c && FT.get(c.type).isCalc && c.resultFormat === 'percentfrac') return U.fmtNumber(parseFloat((v * 100).toPrecision(12)), 1) + '%';
  const dec = Number.isInteger(v) ? 0 : (c && c.decimals !== '' && c.decimals !== undefined && !FT.get(c.type).isCalc ? Number(c.decimals) : 2);
  if (c && (c.type === 'percentage' || (FT.get(c.type).isCalc && c.resultFormat === 'percentage'))) return U.fmtNumber(v, Math.max(dec, Number.isInteger(v) ? 0 : 1)) + '%';
  return U.fmtNumber(v, dec);
}

function aggregateChart(cfg, records) {
  const cols = planCols(); const colOf = id => cols.find(c => c.id === id);
  const xCol = cfg.x ? colOf(cfg.x) : null; const gCol = (cfg.group && (cfg.measures || []).length === 1) ? colOf(cfg.group) : null;
  const measures = (cfg.measures && cfg.measures.length ? cfg.measures : [{ col: COUNT_COL, agg: 'count' }]).filter(m => m.col === COUNT_COL || colOf(m.col));
  const cats = new Map(); const seriesMeta = new Map();
  records.forEach(rec => {
    const xs = xCol ? bucketsFor(rec, xCol, cfg.gran) : [{ key: 'all', label: 'الإجمالي', sort: 0 }];
    const gs = gCol ? bucketsFor(rec, gCol, 'month') : [null];
    xs.forEach(xb => {
      if (!cats.has(xb.key)) cats.set(xb.key, { label: xb.label, sort: xb.sort, accs: new Map() });
      const cat = cats.get(xb.key);
      gs.forEach(gb => {
        measures.forEach((m, mi) => {
          const sk = gb ? gb.key : 'm' + mi;
          if (!seriesMeta.has(sk)) seriesMeta.set(sk, { name: gb ? gb.label : measureName(m, cols), sort: gb ? gb.sort : mi, mi });
          if (!cat.accs.has(sk)) cat.accs.set(sk, newAcc());
          const isCnt = m.col === COUNT_COL;
          accAdd(cat.accs.get(sk), isCnt ? null : Model.value(rec, colOf(m.col), S.computed), isCnt);
        });
      });
    });
  });
  let list = Array.from(cats.entries()).map(([key, c]) => ({ key, label: c.label, sort: c.sort, accs: c.accs }));
  const sKeys = Array.from(seriesMeta.entries()).sort((a, b) => { const x = a[1].sort, y = b[1].sort; return typeof x === 'number' && typeof y === 'number' ? x - y : U.compareText(x, y); }).map(e => e[0]);
  const val = (c, sk) => { const meta = seriesMeta.get(sk); const m = measures[meta.mi]; const acc = c.accs.get(sk); return acc ? accFinal(acc, m.agg) : 0; };
  const total = c => sKeys.reduce((s, sk) => s + (val(c, sk) || 0), 0);
  const sort = cfg.sort || (xCol && (FT.get(xCol.type).isDate || xCol.type === 'select') ? 'label' : 'value_desc');
  if (sort === 'label') list.sort((a, b) => (typeof a.sort === 'number' && typeof b.sort === 'number') ? a.sort - b.sort : U.compareText(a.sort, b.sort));
  else if (sort === 'value_desc') list.sort((a, b) => total(b) - total(a));
  else if (sort === 'value_asc') list.sort((a, b) => total(a) - total(b));
  if (cfg.top && cfg.top > 0 && list.length > cfg.top) list = list.slice(0, cfg.top);

}

/* ---------- KPI computation ---------- */
function computeKpi(k, records) {
  const cols = planCols(); const colOf = id => cols.find(c => c.id === id);
  const total = records.length;
  let value = 0, text = '', pct = null;
  if (k.kind === 'count') { value = total; text = U.fmtNumber(total, 0); }
  else if (k.kind === 'where') {
    const col = colOf(k.col); if (!col) return { label: k.label, text: '—', color: k.color };
    const set = new Set(k.values || []);
    const n = records.filter(r => { const v = Model.value(r, col, S.computed); return Array.isArray(v) ? v.some(x => set.has(x)) : set.has(v); }).length;
    if (k.asPercent) { value = total ? n / total * 100 : 0; text = U.fmtNumber(value, 1) + '%'; pct = value; } else { value = n; text = U.fmtNumber(n, 0); if (total) pct = n / total * 100; }
  } else if (k.kind === 'ratio') {
    const a = colOf(k.col), b = colOf(k.col2); if (!a || !b) return { label: k.label, text: '—', color: k.color };
    let sa = 0, sb = 0; records.forEach(r => { const x = Model.value(r, a, S.computed), y = Model.value(r, b, S.computed); if (typeof x === 'number') sa += x; if (typeof y === 'number') sb += y; });
    value = sb ? sa / sb * 100 : 0; text = U.fmtNumber(value, 1) + '%'; pct = Math.min(100, value);
  } else if (k.kind === 'expr') {
    // column-wide expression (e.g. IFERROR(COLAVG([انجاز ف١]),"")) — used for summary rows imported from Excel
    const r = FX.evalAggregate(k.expr || '', cols, records, S.computed);
    if (r.error || typeof r.value !== 'number') return { label: k.label, text: '—', color: k.color };
    value = r.value;
    if (k.fmt === 'percentfrac') { text = U.fmtNumber(parseFloat((value * 100).toPrecision(12)), k.decimals === undefined ? 1 : k.decimals) + '%'; pct = Math.max(0, Math.min(100, value * 100)); }
    else text = U.fmtNumber(value, k.decimals === undefined ? (Number.isInteger(value) ? 0 : 2) : k.decimals);
  } else {
    const col = colOf(k.col); if (!col) return { label: k.label, text: '—', color: k.color };
    const acc = newAcc(); records.forEach(r => accAdd(acc, Model.value(r, col, S.computed), false));
    value = accFinal(acc, k.agg || 'sum'); text = fmtMeasure({ col: col.id, agg: k.agg || 'sum' }, value, cols);
    if ((col.type === 'percentage' || (FT.get(col.type).isCalc && col.resultFormat === 'percentage')) && (k.agg === 'avg' || k.agg === 'min' || k.agg === 'max')) pct = Math.min(100, value);
    if (((col.type === 'numeric' && col.numberMode === 'percent') || (FT.get(col.type).isCalc && col.resultFormat === 'percentfrac')) && (k.agg === 'avg' || k.agg === 'min' || k.agg === 'max')) pct = Math.max(0, Math.min(100, value * 100));
  }
  return { label: k.label, text, value, pct, color: k.color };
}

function statusColorFor(label) {
  const s = nm(label);
  if (KW.late.test(s)) return '#B83232'; if (KW.done.test(s)) return '#1F7A4D'; if (KW.prog.test(s)) return '#B7791F'; if (KW.pending.test(s)) return '#718096';
  return null;
}
function numericCols(cols) { return cols.filter(c => FT.isNumericCol(c)); }

/** Simple (non-custom) validations covering a column + dropdown sources. */

XL.propsForType = function (type, st, dv, extra) {

XL.inferType = function (st, dv, hint) {

  if (hint && hint.number) { R.push('قاعدة التحقق تشترط أن تكون القيمة رقماً'); return done('numeric', 0.9); }
  if (nb === 0) {

  if (st.bool / nb >= 0.9) { R.push('قيم منطقية'); return done('boolean', 0.9); }
  const numericish = st.number + st.numText;

    if (st.numText > 0) warn.push(st.numText + ' رقم مخزّن كنص في Excel وسيُحوَّل.');
    if (pctShare >= 0.9) { R.push('تنسيق نسبة مئوية'); return done('numeric', 0.6 + 0.4 * purity, warn); }
    if (pctShare > 0) { R.push('خليط من نسب وأرقام عادية'); return done('numeric', 0.8, warn); }
    if (st.cur / Math.max(1, st.number) >= 0.6) { R.push('تنسيق عملة'); return done('currency', 0.6 + 0.4 * purity, warn); }
    if (st.numText / numericish > 0.1) { R.push('أرقام مخزّنة جزئياً كنص'); return done('numeric', 0.7, warn); }
    if (st.dec === 0) { R.push('كل القيم أعداد صحيحة'); return done('number', 0.6 + 0.4 * purity, warn); }

    R.push('نص حر'); return done('text', 0.9);

/* =====================================================================

XL.buildDraft = function (model, opts) {

  const dataRowSet = new Set(table.dataRows);
  const overlapsData = rg => rg.r2 >= table.firstRow && rg.r1 <= table.lastRow;
  table.cols.forEach(col => {
    const cands = customGroups.filter(g => g.cols.has(col.c));
    if (!cands.length) return;
    let use = cands.filter(g => overlapsData(g.cols.get(col.c)));
    const ignored = cands.filter(g => !use.includes(g));
    if (!use.length) { use = cands; }
    const seen = new Set();
    use.forEach(g => {
      const text = String(g.dv.formulae[0] === undefined ? '' : g.dv.formulae[0]).replace(/^=/, '').trim();
      if (new RegExp('^ISNUMBER\\(\\$?[A-Z]{1,3}\\$?\\d+\\)$', 'i').test(text)) { numberHint.add(col.letter); return; }     // handled as numeric type
      const tr = XL.translateFormula(text, { row: g.anchorR, colShift: col.c - g.anchorC, firstRow: table.firstRow, lastRow: table.lastRow, colInfo });
      const key = tr.relative + '|' + g.dv.error; if (seen.has(key)) return; seen.add(key);
      if (tr.name.indexOf('ISNUMBER([' + col.name + '])') >= 0) numberHint.add(col.letter);
      const rule = { id: 'rule_' + col.letter + '_' + (seen.size), name: 'تحقق: ' + col.name, enabled: true, scope: 'row', severity: 'error', appliesTo: 'c_' + col.letter, expr: tr.id, exprText: tr.name, onBlank: 'evaluate', onError: 'fail', skipWhenTargetBlank: !!g.dv.allowBlank, message: g.dv.error || 'القيمة لا تحقق شرط التحقق', source: { formulaA1: text, relative: tr.relative } };
      if (tr.problems.length) { rule.enabled = false; rule.unsupported = XL.problemText(tr.problems); warnings.push('قاعدة التحقق على «' + col.name + '» لم تُترجم: ' + rule.unsupported); }
      rules.push(rule);
    });
    ignored.forEach(g => {
      const text = String(g.dv.formulae[0] === undefined ? '' : g.dv.formulae[0]).replace(/^=/, '').trim(); const rg = g.cols.get(col.c);
      const tr = XL.translateFormula(text, { row: g.anchorR, colShift: col.c - g.anchorC, firstRow: table.firstRow, lastRow: table.lastRow, colInfo });
      if (!use.some(u => rules.some(r => r.appliesTo === 'c_' + col.letter && r.source.relative === tr.relative))) warnings.push('على العمود «' + col.name + '» تحقق إضافي للصفوف ' + rg.r1 + '–' + rg.r2 + ' صيغته تختلف عن تحقق الصفوف الحالية (يختلف عن النمط المستخدم في بقية الصفوف، وقد يكون خطأ نسخ في القالب) — لم يُستورد؛ راجعه.');

    } else if (it.fa) d.excel = { formulaA1: it.fa.formulaA1, relative: it.fa.relative, problems: XL.problemText(it.fa.problems) };

  stages.push(colDrafts.filter(c => c.type === 'formula').length + ' عمود صيغ تُرجمت إلى صيغ التطبيق');

XL.draftToPlan = function (draft, meta) {
  const plan = Model.newPlan({ name: meta.name, authority: meta.authority, startYear: meta.startYear, endYear: meta.endYear, frequency: meta.frequency || 'quarterly' });
  const CATEGORY = /(جهة|قسم|دائرة|مديرية|وزارة|مؤسسة|department|owner|responsible|status|حالة|أولوية|الأولويات|priority)/i;
  draft.columns.forEach((d, i) => {
    const c = Model.newColumn(d.type, d.name);
    c.id = d.id; c.order = i;
    ['numberMode', 'acceptPercentSyntax', 'percentScale', 'plainIsPercent', 'decimals', 'currencySymbol', 'min', 'max', 'minLength', 'maxLength', 'options'].forEach(k => { if (d[k] !== undefined) c[k] = U.clone(d[k]); });
    if (d.group) c.group = d.group;
    if (d.type === 'formula') { c.formula = d.formula; c.resultFormat = d.resultFormat || 'number'; c.editable = false; c.decimals = d.decimals === undefined ? '' : d.decimals; }
    c.filterable = ['select', 'boolean', 'date', 'datetime'].includes(d.type) || (d.type === 'text' && CATEGORY.test(d.name));
    c.width = 0;
    plan.config.columns.push(c);
  });
  plan.config.rules = draft.rules.filter(r => r.enabled !== undefined).map(r => ({
    id: r.id, name: r.name, enabled: r.enabled, scope: 'row', severity: r.severity, appliesTo: r.appliesTo, expr: r.expr, onBlank: r.onBlank, onError: r.onError,
    skipWhenTargetBlank: !!r.skipWhenTargetBlank, message: r.message, source: r.source
  }));
  plan.config.summaries = draft.summaries.map(s => ({ id: s.id, label: s.label, expr: s.expr, fmt: s.fmt, decimals: s.decimals, color: s.color }));
  plan.config.excelSource = { fileName: draft.meta.source, sheet: draft.meta.sheet, headerRow: draft.meta.headerRow, importedAt: U.nowISO() };
  if (meta.withRecords) draft.records.forEach(r => { const rec = Model.newRecord(plan, false); Object.keys(r.values).forEach(k => { rec.values[k] = r.values[k]; }); plan.records.push(rec); });
  Model.reindex(plan);
  return plan;
};

  const run = (t, o) => { o = o || {}; return new X.TextRun({ text: String(t === null || t === undefined ? '' : t), rightToLeft: true, font: FONT, size: o.size || 22, sizeComplexScript: o.size || 22, bold: !!o.bold, boldComplexScript: !!o.bold, color: o.color }); };
  const para = (runs, o) => { o = o || {}; return new X.Paragraph({ children: Array.isArray(runs) ? runs : [runs], bidirectional: true, alignment: o.align || X.AlignmentType.START, spacing: { before: o.before || 0, after: o.after === undefined ? 100 : o.after }, keepNext: !!o.keepNext, border: o.border }); };
  const cell = (txt, o) => { o = o || {}; return new X.TableCell({ children: [para(run(txt, { size: 19, bold: o.bold }), { after: 20, align: o.num ? X.AlignmentType.CENTER : X.AlignmentType.START })], shading: o.fill ? { type: X.ShadingType.CLEAR, fill: o.fill, color: 'auto' } : undefined, margins: { top: 50, bottom: 50, left: 90, right: 90 }, verticalAlign: X.VerticalAlign.CENTER, width: o.w ? { size: o.w, type: X.WidthType.PERCENTAGE } : undefined }); };
  const table = (head, rows, foot, numFlags) => {
    const trs = [new X.TableRow({ tableHeader: true, cantSplit: true, children: head.map(t => cell(t, { bold: true, fill: 'E3EBED' })) })];
    rows.forEach(r => trs.push(new X.TableRow({ cantSplit: true, children: r.map((t, i) => cell(t, { num: numFlags && numFlags[i] })) })));
    if (foot) trs.push(new X.TableRow({ children: foot.map(t => cell(t, { bold: true, fill: 'F1F1F1' })) }));
    return new X.Table({ width: { size: 100, type: X.WidthType.PERCENTAGE }, visuallyRightToLeft: true, rows: trs });
  };
  const kids = [];
  if (p.authority) kids.push(para(run(p.authority, { size: 22, color: '555555' }), { align: X.AlignmentType.CENTER, after: 60 }));
  kids.push(para(run(rep.title || p.name, { size: 38, bold: true, color: '0E5A63' }), { align: X.AlignmentType.CENTER, after: 200 }));
  kids.push(new X.Table({ width: { size: 100, type: X.WidthType.PERCENTAGE }, visuallyRightToLeft: true, rows: meta.map(m => new X.TableRow({ cantSplit: true, children: [cell(m[0], { bold: true, fill: 'F1F4F5', w: 28 }), cell(m[1], { w: 72 })] })) }));
  kids.push(para(run(''), { after: 160 }));
  secs.forEach(({ sec, data, img }) => {
    kids.push(para(run(sec.title || '', { size: 28, bold: true, color: '0E5A63' }), { before: 240, after: 120, keepNext: true, border: { bottom: { style: X.BorderStyle.SINGLE, size: 6, color: 'C58B2B', space: 2 } } }));
    if (sec.type === 'kpi') {
      if (data.items.length) kids.push(table(['المؤشر', 'القيمة'], data.items.map(k => [k.label, k.text]), null, [false, true]));
    } else if (sec.type === 'summary') {
      data.lines.forEach(l => kids.push(para(run('• ' + l))));
      if (data.note) data.note.split(/\n/).forEach(l => kids.push(para(run(l))));
    } else if (sec.type === 'notes') {
      const lines = (sec.note || '').split(/\n/);
      (sec.note ? lines : ['لا توجد ملاحظات.']).forEach(l => kids.push(para(run(l))));
    } else if (sec.type === 'chart') {
      if (!data.labels.length) kids.push(para(run('لا توجد بيانات لعرضها.')));
      else {
        if (img) kids.push(new X.Paragraph({ alignment: X.AlignmentType.CENTER, spacing: { after: 100 }, children: [new X.ImageRun({ data: dataUrlToBytes(img), type: 'png', transformation: { width: 560, height: 268 } })] }));
        const head = [''].concat(data.series.map(s => s.name));
        const rows = data.labels.map((l, i) => [l].concat(data.series.map(s => fmtMeasure(s.m, s.data[i], data.cols))));
        if (sec.chartType === 'progress' && data.series.length > 1) { head.push('نسبة الإنجاز'); rows.forEach((r, i) => { const t = data.series[1].data[i]; r.push(t ? U.fmtNumber(data.series[0].data[i] / t * 100, 1) + '%' : '—'); }); }
        kids.push(table(head.map((x, i) => i === 0 ? 'التصنيف' : x), rows, null, head.map((x, i) => i > 0)));
      }
    } else if (sec.type === 'table') {
      if (data.head && data.head.length) { kids.push(table(data.head, data.rows.slice(0, 1000), data.foot, data.numFlags || data.head.map((x, i) => i >= (data.numFrom || 99)))); if (data.more) kids.push(para(run('عُرض جزء من السجلات؛ يوجد ' + data.more + ' سجل إضافي.', { size: 18, color: '666666' }), { before: 80 })); }
    }
  });
  kids.push(para(run('خلاصة وتوقيع المسؤول', { size: 22, bold: true }), { before: 360, after: 400 }));
  kids.push(para(run('الاسم والتوقيع: ______________________      التاريخ: ____ / ____ / ________', { size: 20 })));
  const doc = new X.Document({
    creator: 'SPMERS', title: rep.title || p.name,
    sections: [{
      properties: { page: { margin: { top: 1100, bottom: 1100, left: 1000, right: 1000 } } },
      headers: { default: new X.Header({ children: [para(run(p.name + (p.authority ? ' — ' + p.authority : ''), { size: 17, color: '777777' }), { after: 0 })] }) },
      footers: { default: new X.Footer({ children: [new X.Paragraph({ alignment: X.AlignmentType.CENTER, bidirectional: true, children: [new X.TextRun({ children: ['صفحة ', X.PageNumber.CURRENT, ' من ', X.PageNumber.TOTAL_PAGES], rightToLeft: true, font: FONT, size: 17, sizeComplexScript: 17, color: '777777' })] })] }) },
      children: kids
    }]
  });
  return X.Packer.toBlob(doc);
}

/* Fallback when the docx library is unavailable: Word opens HTML with RTL markup. */
function buildWordHTML(p, rep, secs, meta) {
  const esc = s => String(s === null || s === undefined ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const tbl = (head, rows, foot) => '<table border="1" cellspacing="0" cellpadding="4" dir="rtl" style="border-collapse:collapse;width:100%;font-size:10pt"><tr>' + head.map(x => '<th style="background:#e3ebed">' + esc(x) + '</th>').join('') + '</tr>' + rows.map(r => '<tr>' + r.map(c => '<td>' + esc(c) + '</td>').join('') + '</tr>').join('') + (foot ? '<tr>' + foot.map(c => '<td><b>' + esc(c) + '</b></td>').join('') + '</tr>' : '') + '</table>';
  let html = '<html dir="rtl" lang="ar" xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word"><head><meta charset="utf-8"><title>' + esc(rep.title || p.name) + '</title></head><body dir="rtl" style="font-family:Arial;direction:rtl;text-align:right">';
  html += '<h1 style="text-align:center;color:#0E5A63">' + esc(rep.title || p.name) + '</h1>' + tbl(['البند', 'القيمة'], meta);
  secs.forEach(({ sec, data, img }) => {
    html += '<h2 style="color:#0E5A63">' + esc(sec.title) + '</h2>';
    if (sec.type === 'kpi') html += tbl(['المؤشر', 'القيمة'], data.items.map(k => [k.label, k.text]));
    else if (sec.type === 'summary') html += '<ul>' + data.lines.map(l => '<li>' + esc(l) + '</li>').join('') + '</ul><p>' + esc(data.note).replace(/\n/g, '<br>') + '</p>';
    else if (sec.type === 'notes') html += '<p>' + esc(sec.note).replace(/\n/g, '<br>') + '</p>';
    else if (sec.type === 'chart' && data.labels.length) { if (img) html += '<p><img src="' + img + '" width="560"></p>'; html += tbl(['التصنيف'].concat(data.series.map(s => s.name)), data.labels.map((l, i) => [l].concat(data.series.map(s => fmtMeasure(s.m, s.data[i], data.cols))))); }
    else if (sec.type === 'table' && data.head) html += tbl(data.head, data.rows.slice(0, 1000), data.foot);
  });
  return new Blob(['\ufeff' + html + '</body></html>'], { type: 'application/msword' });
}

async function wipeAllFlow() {
  const ok = await Dlg.confirm({ title: 'حذف جميع الخطط', danger: true, message: 'سيتم حذف كل الخطط وبياناتها وسجل التدقيق من هذا الجهاز نهائياً.', detail: 'صدّر نسخة احتياطية شاملة أولاً.', confirmLabel: 'متابعة' });
  if (!ok) return;
  const ok2 = await Dlg.confirm({ title: 'تأكيد نهائي', danger: true, message: 'للتأكيد اكتب العبارة التالية.', typeToConfirm: 'حذف الكل', confirmLabel: 'حذف نهائي' });
  if (!ok2) return;
  for (const p of S.plans.slice()) await deletePlanById(p.id);
  refreshChrome(); navigate('plans'); toast('تم حذف جميع الخطط', 'ok');
}

/* =====================================================================
   Theme, navigation, boot
   ===================================================================== */
function setTheme(t) {
  S.theme = t;
  if (t === 'auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', t);
  Store.run(() => Store.a.kvSet('theme', t));
  const dark = t === 'dark' || (t === 'auto' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
  const b = $('#theme-btn'); if (b) { clear(b); b.appendChild(icon(dark ? 'sun' : 'moon')); }
  if (S.page === 'reports' && window.Chart) redrawCharts(false);
}

function renderPage() {
  switch (S.page) {
    case 'plans': renderPlans(); break;
    case 'data': renderData(); break;
    case 'reports':
      if (!can('reports')) { const r = $('#page-reports'); clear(r); r.appendChild(h('div', { class: 'alert' }, icon('lock'), h('div', { text: 'لا تملك صلاحية عرض التقارير.' }))); hydrateIcons(r); } else renderReports();
      break;
    case 'audit': renderAudit(); break;
    case 'help': renderHelp(); break;
  }
}

function navigate(page) {
  if (UI.d.editId && page !== 'data') { UI.d.editId = null; }
  Menu.close();
  S.page = page;
  $$('.page').forEach(s => { s.hidden = s.id !== 'page-' + page; });
  $$('[data-page]').forEach(b => { if (b.dataset.page === page) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current'); });
  if (page !== 'reports') destroyCharts();
  renderPage();
  window.scrollTo(0, 0);
  const t = $('#main'); if (t) { try { t.focus({ preventScroll: true }); } catch (e) { /* noop */ } }
}

function showBanner() {
  const b = $('#banner'); clear(b);
  if (Store.mode === 'memory') b.appendChild(h('div', { class: 'alert warn', style: 'margin:10px 16px 0' }, icon('warn'), h('div', { text: 'تعذّر الوصول إلى مخزن المتصفح (قد تكون في وضع التصفح الخاص أو مقيّداً). البيانات ستُفقد عند إغلاق الصفحة؛ صدّر نسخة JSON بانتظام.' })));
  if (S.embedded) b.appendChild(h('div', { class: 'alert', style: 'margin:10px 16px 0' }, icon('info'), h('div', { text: 'نسخة مستقلة مولّدة بتاريخ ' + D.fmtDateTime(S.embedded.generatedAt) + (S.embedded.options.lockRole ? ' — للعرض فقط.' : '.') })));
  hydrateIcons(b);
}

async function boot() {
  hydrateIcons(document);
  // embedded package (generated standalone file)
  let emb = null;
  const embEl = document.getElementById('spmers-embedded');
  if (embEl) { try { emb = JSON.parse(embEl.textContent); } catch (e) { emb = null; } }
  S.embedded = (emb && emb.package && emb.packageId) ? emb : null;
  UI.d.colsOpen = !MQ.matches; // on phones the field list starts collapsed so the records are reached sooner
  await Store.init(S.embedded ? 'spmers-emb-' + String(S.embedded.packageId).replace(/[^\w-]/g, '') : 'spmers-db');
  S.plans = (await Store.a.listPlans()).map(p => { const x = migratePlan(Object.assign({}, p)); delete x.records; x.recordCount = p.recordCount || 0; return x; });
  const kvRole = await Store.a.kvGet('role'), kvTheme = await Store.a.kvGet('theme');
  S.role = ROLES[kvRole] ? kvRole : 'admin';
  if (S.embedded && S.embedded.options && S.embedded.options.lockRole) S.role = ROLES[S.embedded.options.role] ? S.embedded.options.role : 'viewer';
  setTheme(kvTheme === 'light' || kvTheme === 'dark' ? kvTheme : 'auto');

  if (S.embedded && !(await Store.a.kvGet('embSeeded'))) {
    try { await applyImportedPackage(S.embedded.package, 'new'); await Store.a.kvSet('embSeeded', true); await Store.flush(); } catch (e) { toast('تعذّر تحميل الخطة المضمّنة: ' + e.message, 'err', 8000); }
  }
  showBanner();

  // events
  $$('[data-page]').forEach(b => b.addEventListener('click', () => navigate(b.dataset.page)));
  $('#plan-pick').addEventListener('click', e => openPlanPicker(e.currentTarget));
  $('#theme-btn').addEventListener('click', () => { const dark = document.documentElement.getAttribute('data-theme') === 'dark' || (S.theme === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches); setTheme(dark ? 'light' : 'dark'); });
  if (MQ.addEventListener) MQ.addEventListener('change', () => { if (S.page === 'data' && S.plan) renderTable(); });
  const flushAll = () => { try { persistPlanNow(); Audit.flush(); } catch (e) { /* noop */ } };
  window.addEventListener('pagehide', flushAll);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') flushAll(); });
  window.addEventListener('beforeunload', e => { if (UI.d.editId) { e.preventDefault(); e.returnValue = ''; } });

  // open last plan
  const last = await Store.a.kvGet('lastPlan');
  const target = (S.plan && S.plan.id) || (S.plans.find(p => p.id === last) || S.plans.find(p => p.status !== 'archived') || {}).id;
  refreshChrome();
  if (S.plan) navigate(S.embedded ? 'data' : 'data');
  else if (target) await openPlan(target, 'data');
  else navigate('plans');
  document.documentElement.setAttribute('data-ready', '1');
}

window.__spmers = { S, UI, FX, FT, Model, Filter, Store };
boot().catch(err => { console.error(err); const m = document.getElementById('main'); if (m) { clear(m); m.appendChild(h('div', { class: 'alert danger' }, h('div', { text: 'حدث خطأ أثناء تشغيل التطبيق: ' + (err && err.message ? err.message : err) }))); } });

</script>
